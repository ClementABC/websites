    <meta name="color-scheme" content="light dark" />
    <title>Quiz — Histoire de la Danse</title>

    <!-- ============================================================
         CONFIGURATION: Replace this URL after deploying the Apps Script
         ============================================================ -->
    <script>
      window.__DANCE_QUIZ_CONFIG = {
        APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGGNuA10ZVnXfdbtqH4kj68UNJ3y2D-uYZHoY1mH5cW6lKbjbGDwrB7qWMQQpvHKxpTQ/exec
      };
    </script>

    <!-- ============================================================
         Fetch interceptor: routes Space.* calls to Google Sheets
         via the Apps Script web app URL above
         ============================================================ -->
    <script>
      (function() {
        const origFetch = window.fetch;

        window.fetch = function(url, opts) {
          // Only intercept POST calls to the ./actions endpoint
          if (typeof url === 'string' && (url.endsWith('/actions') || url.includes('/actions?')) && opts) {
            try {
              const body = JSON.parse(opts.body);
              const gasUrl = window.__DANCE_QUIZ_CONFIG.APPS_SCRIPT_URL;

              // Always save to localStorage first (instant, reliable)
              var localResult = handleLocalFallback(body);

              if (gasUrl && !gasUrl.includes('PASTE_YOUR')) {
                // Also send to Google Apps Script (fire-and-forget)
                // Use text/plain to avoid CORS preflight; redirect: follow for GAS 302
                origFetch(gasUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify(body),
                  redirect: 'follow'
                }).catch(function(e) { console.log('GAS sync error (non-fatal):', e); });
              }

              // Return localStorage result to the app immediately
              return localResult;
            } catch(e) {
              // Fall through to original fetch
            }
          }
          return origFetch.apply(this, arguments);
        };

        // ---- localStorage fallback (always works) ----

        function handleLocalFallback(body) {
          var action = body.action;
          var args = body.args || {};
          var result;

          switch(action) {
            case 'save_student_session':
              result = localSaveSession(args);
              break;
            case 'save_student_answer':
              result = localSaveAnswer(args);
              break;
            case 'get_teacher_results':
              result = localGetResults();
              break;
            default:
              result = { error: 'unknown action' };
          }

          return Promise.resolve(new Response(JSON.stringify(result), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }

        function makeSyntheticResponse(body) {
          var action = body.action;
          var args = body.args || {};
          var result;

          switch(action) {
            case 'save_student_session':
              result = localSaveSession(args);
              break;
            case 'save_student_answer':
              result = { ok: true };
              break;
            case 'get_teacher_results':
              result = localGetResults();
              break;
            default:
              result = {};
          }

          return new Response(JSON.stringify(result), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }

        function localSaveSession(args) {
          var sessions = JSON.parse(localStorage.getItem('dq_sessions') || '[]');

          if (args.session_id) {
            // Update existing
            for (var i = 0; i < sessions.length; i++) {
              if (sessions[i].id === args.session_id) {
                sessions[i].completed_at = new Date().toISOString();
                sessions[i].total_score = args.total_score || 0;
                sessions[i].max_score = args.max_score || 0;
                sessions[i].phase_scores = tryParse(args.phase_scores);
                break;
              }
            }
            localStorage.setItem('dq_sessions', JSON.stringify(sessions));
            return { session_id: args.session_id, ok: true };
          } else {
            // New session
            var sid = Date.now();
            sessions.push({
              id: sid,
              student_name: args.student_name || '',
              started_at: new Date().toISOString(),
              completed_at: null,
              total_score: 0,
              max_score: 0,
              phase_scores: {},
              answers: []
            });
            localStorage.setItem('dq_sessions', JSON.stringify(sessions));
            return { session_id: sid, ok: true };
          }
        }

        function localSaveAnswer(args) {
          var sessions = JSON.parse(localStorage.getItem('dq_sessions') || '[]');
          for (var i = 0; i < sessions.length; i++) {
            if (sessions[i].id === args.session_id) {
              if (!sessions[i].answers) sessions[i].answers = [];
              sessions[i].answers.push({
                question_id: args.question_id || 0,
                answer_json: args.answer_json || '{}',
                is_correct: !!args.is_correct,
                points_earned: args.points_earned || 0,
                answered_at: new Date().toISOString()
              });
              break;
            }
          }
          localStorage.setItem('dq_sessions', JSON.stringify(sessions));
          return { ok: true };
        }

        function localGetResults() {
          var sessions = JSON.parse(localStorage.getItem('dq_sessions') || '[]');
          return {
            sessions: sessions.slice().reverse(),
            total_students: sessions.length
          };
        }

        function tryParse(s) {
          if (typeof s === 'object') return s;
          try { return JSON.parse(s); } catch(_) { return {}; }
        }

        // ---- Also send to GAS via beacon on quiz completion ----
        var origBeacon = navigator.sendBeacon;
        if (origBeacon) {
          navigator.sendBeacon = function(url, data) {
            return origBeacon.apply(this, arguments);
          };
        }
      })();
    </script>
