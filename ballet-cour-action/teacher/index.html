<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Ballet Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:rgba(255,255,255,0.04);--surface-2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--text:#e8e6e3;--dim:rgba(255,255,255,0.5);--purple:#9b6dff;--purple-glow:rgba(155,109,255,0.15);--gold:#d4a853;--gold-glow:rgba(212,168,83,0.15);--green:#4ade80;--green-glow:rgba(74,222,128,0.15);--red:#f87171;--red-glow:rgba(248,113,113,0.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:16px;padding-bottom:80px}
h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin:24px 0 8px}
.subtitle{text-align:center;color:var(--dim);font-size:13px;margin-bottom:24px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.tab{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .2s}
.tab.active{background:var(--purple-glow);color:var(--purple);border-color:rgba(155,109,255,0.3)}
.tab:hover{border-color:var(--purple)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:12px}
.card-header h3{font-size:15px;font-weight:600;flex:1}
.card-header .count{font-size:12px;color:var(--dim);background:var(--surface-2);padding:4px 10px;border-radius:8px}
.card-body{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.card-body.open{display:block}
.q-item{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.q-item:hover{border-color:rgba(155,109,255,0.2)}
.q-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer}
.q-id{font-size:11px;color:var(--gold);font-weight:600;white-space:nowrap}
.q-type{font-size:10px;color:var(--dim);background:var(--surface);padding:2px 8px;border-radius:6px;margin-left:6px}
.q-text{font-size:14px;line-height:1.5;margin-top:6px}
.q-details{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.q-edit-form{margin-top:12px;display:none;border-top:1px solid var(--border);padding-top:12px}
.q-edit-form.open{display:block}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--purple)}
.field textarea{min-height:80px;resize:vertical}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .2s}
.btn-save{background:linear-gradient(135deg,var(--purple),#7c4dff);color:white}
.btn-save:hover{box-shadow:0 2px 12px rgba(155,109,255,0.3)}
.btn-save:disabled{opacity:0.4;cursor:not-allowed}
.btn-delete{background:var(--red-glow);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.btn-delete:hover{background:rgba(248,113,113,0.2)}
.btn-add{background:var(--green-glow);color:var(--green);border:1px solid rgba(74,222,128,0.2);width:100%;padding:12px;margin-top:8px}
.btn-add:hover{background:rgba(74,222,128,0.2)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--purple)}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,0.95);border-top:1px solid var(--border);padding:12px 16px;display:flex;justify-content:center;align-items:center;gap:12px;backdrop-filter:blur(10px);z-index:100}
.status-text{font-size:13px;color:var(--dim)}
.status-text.saving{color:var(--gold)}
.status-text.saved{color:var(--green)}
.status-text.error{color:var(--red)}
.resp-table{width:100%;border-collapse:collapse;font-size:13px}
.resp-table th{text-align:left;padding:10px;color:var(--dim);font-weight:500;border-bottom:1px solid var(--border);font-size:12px}
.resp-table td{padding:10px;border-bottom:1px solid var(--border)}
.resp-table tr:hover{background:var(--surface)}
.badge-pass{color:var(--green);background:var(--green-glow);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-fail{color:var(--red);background:var(--red-glow);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.login-box{max-width:360px;margin:120px auto;text-align:center}
.login-box input[type="password"]{width:100%;padding:14px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;margin-top:16px;text-align:center}
.login-box input:focus{outline:none;border-color:var(--purple)}
.login-box button{margin-top:16px;width:100%;padding:14px;background:linear-gradient(135deg,var(--purple),#7c4dff);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green-glow);color:var(--green);padding:10px 24px;border-radius:10px;font-size:14px;font-weight:500;z-index:200;animation:toastIn .3s ease}
.toast.error{background:var(--red-glow);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.loading{text-align:center;padding:60px 20px;color:var(--dim)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:14px}
@media(max-width:600px){.resp-table{font-size:11px}.resp-table th,.resp-table td{padding:6px}}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const CONFIG={QUESTIONS_URL:'../questions.json',GITHUB_API:'https://api.github.com/repos/ClementABC/websites/contents/ballet-cour-action/questions.json',GITHUB_BRANCH:'main',SHEET_ID:'1qzX4VKHRXPYR-R_daOFVdnEfIMKOUkLLEgjKDHjLwkM',PASSWORD:'Tixi'};
let quizData=null,currentTab='editor',hasChanges=false;

function checkAuth(){if(sessionStorage.getItem('ballet-dash-auth')==='ok')return true;renderLogin();return false;}
function renderLogin(){document.getElementById('app').innerHTML='<div class="login-box"><h1>Dashboard Enseignant</h1><p style="color:var(--dim);font-size:14px;margin-top:8px">Quiz — Du ballet de cour au ballet d\'action</p><input type="password" id="pwd" placeholder="Mot de passe" onkeydown="if(event.key===\'Enter\')doLogin()"><button onclick="doLogin()">Entrer</button></div>';setTimeout(()=>document.getElementById('pwd')?.focus(),100);}
function doLogin(){const pwd=document.getElementById('pwd').value;if(pwd===CONFIG.PASSWORD){sessionStorage.setItem('ballet-dash-auth','ok');init();}else{const el=document.getElementById('pwd');el.style.borderColor='var(--red)';el.value='';el.placeholder='Mot de passe incorrect';}}

async function init(){const app=document.getElementById('app');app.innerHTML='<div class="loading"><div class="spinner"></div>Chargement…</div>';try{const resp=await fetch(CONFIG.QUESTIONS_URL);if(!resp.ok)throw new Error('Fetch failed');quizData=await resp.json();renderDashboard();}catch(err){app.innerHTML='<div class="loading" style="color:var(--red)">Erreur de chargement<br><button class="btn btn-secondary" style="margin-top:16px" onclick="init()">Réessayer</button></div>';}}

function renderDashboard(){const app=document.getElementById('app');app.innerHTML='<h1>Dashboard Enseignant</h1><div class="subtitle">'+esc(quizData.title)+' — '+esc(quizData.subtitle)+'</div><div class="tabs"><button class="tab '+(currentTab==='editor'?'active':'')+'" onclick="switchTab(\'editor\')">✏️ Éditeur de questions</button><button class="tab '+(currentTab==='responses'?'active':'')+'" onclick="switchTab(\'responses\')">📊 Réponses des élèves</button></div><div id="tab-content"></div><div class="status-bar" id="status-bar"><span class="status-text" id="status-text">'+quizData.questions.length+' questions · '+quizData.phases.length+' phases</span>'+(currentTab==='editor'?'<button class="btn btn-save" id="save-btn" onclick="saveToGitHub()">💾 Publier les modifications</button>':'')+'</div>';if(currentTab==='editor')renderEditor();else renderResponses();}
function switchTab(tab){currentTab=tab;renderDashboard();}

function renderEditor(){const content=document.getElementById('tab-content');const phases=quizData.phases;let html='';phases.forEach(phase=>{const qs=quizData.questions.filter(q=>q.phase===phase.id);if(!qs.length&&phase.id===0)return;html+='<div class="card"><div class="card-header" onclick="togglePhase(\'phase-'+phase.id+'\')"><h3>'+phase.emoji+' '+esc(phase.title)+'</h3><span class="count">'+qs.length+' questions</span></div><div class="card-body" id="phase-'+phase.id+'">'+qs.map(q=>renderQuestionItem(q)).join('')+'<button class="btn btn-add" onclick="addQuestion(\''+phase.id+'\')">+ Ajouter une question</button></div></div>';});content.innerHTML=html;}

function renderQuestionItem(q){const tl={mcq:'QCM',multi:'Choix multiples',truefalse:'Vrai/Faux',match:'Association',match3:'Assoc. 3 col.',rank:'Classement',text:'Texte court',longtext:'Texte long',words:'Nuage de mots',geo:'Géographie',slider:'Curseur'};return '<div class="q-item" id="q-'+q.id+'"><div class="q-header" onclick="toggleQuestion(\''+q.id+'\')"><div><span class="q-id">'+q.id+'</span><span class="q-type">'+(tl[q.type]||q.type)+'</span></div></div><div class="q-text">'+esc(q.q)+'</div>'+(q.sub?'<div class="q-details">'+esc(q.sub)+'</div>':'')+'<div class="q-edit-form" id="edit-'+q.id+'">'+renderEditFields(q)+'<div class="btn-group"><button class="btn btn-save" onclick="saveQuestion(\''+q.id+'\')">✓ Appliquer</button><button class="btn btn-delete" onclick="deleteQuestion(\''+q.id+'\')">🗑 Supprimer</button></div></div></div>';}

function renderEditFields(q){let h='<div class="field"><label>Question</label><textarea id="f-'+q.id+'-q">'+esc(q.q)+'</textarea></div>';if(q.sub!==undefined)h+='<div class="field"><label>Sous-titre / Consigne</label><textarea id="f-'+q.id+'-sub">'+esc(q.sub||'')+'</textarea></div>';if(q.type==='mcq'){h+='<div class="field"><label>Options (une par ligne)</label><textarea id="f-'+q.id+'-opts">'+(q.opts||[]).join('\n')+'</textarea></div>';h+='<div class="field"><label>Index bonne réponse (0 = première)</label><input type="number" id="f-'+q.id+'-a" value="'+q.a+'"></div>';}if(q.type==='multi'){h+='<div class="field"><label>Options (une par ligne)</label><textarea id="f-'+q.id+'-opts">'+(q.opts||[]).join('\n')+'</textarea></div>';h+='<div class="field"><label>Index bonnes réponses (ex: 0,1,3)</label><input id="f-'+q.id+'-a" value="'+(q.a||[]).join(',')+'"></div>';}if(q.type==='truefalse')h+='<div class="field"><label>Affirmations (JSON)</label><textarea id="f-'+q.id+'-statements" style="min-height:120px">'+esc(JSON.stringify(q.statements||[],null,2))+'</textarea></div>';if(q.type==='match')h+='<div class="field"><label>Paires (JSON: [["clé","valeur"],...])</label><textarea id="f-'+q.id+'-pairs" style="min-height:120px">'+esc(JSON.stringify(q.pairs||[],null,2))+'</textarea></div>';if(q.type==='match3')h+='<div class="field"><label>Lignes (JSON)</label><textarea id="f-'+q.id+'-rows" style="min-height:120px">'+esc(JSON.stringify(q.rows||[],null,2))+'</textarea></div>';if(q.type==='rank'){h+='<div class="field"><label>Items dans l\'ordre correct (un par ligne)</label><textarea id="f-'+q.id+'-items">'+(q.items||[]).join('\n')+'</textarea></div>';}if(q.type==='geo')h+='<div class="field"><label>Items (JSON)</label><textarea id="f-'+q.id+'-items-json" style="min-height:120px">'+esc(JSON.stringify(q.items||[],null,2))+'</textarea></div>';if(q.type==='text'||q.type==='longtext'){h+='<div class="field"><label>Placeholder</label><input id="f-'+q.id+'-ph" value="'+esc(q.ph||'')+'"></div>';h+='<div class="field"><label>Réponse modèle</label><textarea id="f-'+q.id+'-model">'+esc(q.model||'')+'</textarea></div>';}if(q.type==='words'){h+='<div class="field"><label>Max mots</label><input type="number" id="f-'+q.id+'-max" value="'+(q.max||3)+'"></div>';h+='<div class="field"><label>Mots attendus (virgule)</label><input id="f-'+q.id+'-expected" value="'+(q.expected||[]).join(',')+'"></div>';}if(q.type==='slider'){h+='<div class="field"><label>Indice</label><input id="f-'+q.id+'-hint" value="'+esc(q.hint||'')+'"></div>';h+='<div class="field"><label>Labels (virgule)</label><input id="f-'+q.id+'-labels" value="'+(q.labels||[]).join(',')+'"></div>';}return h;}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function togglePhase(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}
function toggleQuestion(id){const el=document.getElementById('edit-'+id);if(el)el.classList.toggle('open');}

function saveQuestion(id){const q=quizData.questions.find(x=>x.id===id);if(!q)return;const v=k=>document.getElementById('f-'+id+'-'+k);if(v('q'))q.q=v('q').value;if(v('sub'))q.sub=v('sub').value;if(q.type==='mcq'){if(v('opts'))q.opts=v('opts').value.split('\n').filter(x=>x.trim());if(v('a'))q.a=parseInt(v('a').value);}if(q.type==='multi'){if(v('opts'))q.opts=v('opts').value.split('\n').filter(x=>x.trim());if(v('a'))q.a=v('a').value.split(',').map(x=>parseInt(x.trim()));}if(q.type==='truefalse'&&v('statements')){try{q.statements=JSON.parse(v('statements').value);}catch(e){showToast('JSON invalide',true);return;}}if(q.type==='match'&&v('pairs')){try{q.pairs=JSON.parse(v('pairs').value);}catch(e){showToast('JSON invalide',true);return;}}if(q.type==='match3'&&v('rows')){try{q.rows=JSON.parse(v('rows').value);}catch(e){showToast('JSON invalide',true);return;}}if(q.type==='rank'&&v('items')){q.items=v('items').value.split('\n').filter(x=>x.trim());q.answer=[...q.items];}if(q.type==='geo'&&v('items-json')){try{q.items=JSON.parse(v('items-json').value);}catch(e){showToast('JSON invalide',true);return;}}if((q.type==='text'||q.type==='longtext')){if(v('ph'))q.ph=v('ph').value;if(v('model'))q.model=v('model').value;}if(q.type==='words'){if(v('max'))q.max=parseInt(v('max').value);if(v('expected'))q.expected=v('expected').value.split(',').map(x=>x.trim()).filter(Boolean);}if(q.type==='slider'){if(v('hint'))q.hint=v('hint').value;if(v('labels'))q.labels=v('labels').value.split(',').map(x=>x.trim());}hasChanges=true;updateStatus('Modifications non publiées','saving');showToast('Question mise à jour ✓');}

function deleteQuestion(id){if(!confirm('Supprimer cette question ?'))return;quizData.questions=quizData.questions.filter(q=>q.id!==id);hasChanges=true;updateStatus('Modifications non publiées','saving');renderEditor();showToast('Question supprimée');}

function addQuestion(phaseId){const pid=phaseId==='N'?'N':parseInt(phaseId);const ids=quizData.questions.map(q=>q.id);let newId;if(pid==='N'){let n=16;while(ids.includes('QN'+n))n++;newId='QN'+n;}else{let n=43;while(ids.includes('Q'+n))n++;newId='Q'+n;}const newQ={id:newId,phase:pid,type:'mcq',q:'Nouvelle question',opts:['Option A','Option B','Option C','Option D'],a:0};const lastIdx=quizData.questions.reduce((acc,q,i)=>q.phase===pid?i:acc,-1);if(lastIdx>=0)quizData.questions.splice(lastIdx+1,0,newQ);else quizData.questions.push(newQ);hasChanges=true;updateStatus('Modifications non publiées','saving');renderEditor();setTimeout(()=>{const el=document.getElementById('edit-'+newId);if(el)el.classList.add('open');const qEl=document.getElementById('q-'+newId);if(qEl)qEl.scrollIntoView({behavior:'smooth',block:'center'});},100);}

function getGitHubToken(){let t=localStorage.getItem('github-pat');if(!t){t=prompt('Token GitHub nécessaire pour publier les modifications.\n\nDemandez-le à Clement.');if(t)localStorage.setItem('github-pat',t.trim());}return t;}

async function saveToGitHub(){const token=getGitHubToken();if(!token)return;updateStatus('Publication en cours…','saving');const btn=document.getElementById('save-btn');if(btn)btn.disabled=true;try{const getResp=await fetch(CONFIG.GITHUB_API+'?ref='+CONFIG.GITHUB_BRANCH,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});if(getResp.status===401||getResp.status===403){localStorage.removeItem('github-pat');throw new Error('Token invalide ou expiré. Redemandez-le à Clement.');}let sha=null;if(getResp.ok){const fd=await getResp.json();sha=fd.sha;}const content=btoa(unescape(encodeURIComponent(JSON.stringify(quizData,null,2))));const body={message:'Mise à jour des questions du quiz',content:content,branch:CONFIG.GITHUB_BRANCH};if(sha)body.sha=sha;const putResp=await fetch(CONFIG.GITHUB_API,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!putResp.ok){const ed=await putResp.json().catch(()=>({}));throw new Error(ed.message||'Erreur GitHub');}hasChanges=false;updateStatus('Publié sur GitHub ✓','saved');showToast('Publié ✓ — visible par les étudiants dans ~1 min');}catch(err){updateStatus('Erreur : '+err.message,'error');showToast(err.message,true);}finally{if(btn)btn.disabled=false;}}

async function renderResponses(){const content=document.getElementById('tab-content');content.innerHTML='<div class="loading"><div class="spinner"></div>Chargement des réponses…</div>';try{const sessUrl='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:json&sheet=Sheet1';const sessResp=await fetch(sessUrl);const sessText=await sessResp.text();const sessData=parseGviz(sessText);const ansUrl='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:json&sheet=Answers';const ansResp=await fetch(ansUrl);const ansText=await ansResp.text();const ansData=parseGviz(ansText);let html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:16px;color:var(--text)">📋 Sessions ('+sessData.length+')</h2><button class="btn btn-secondary" onclick="renderResponses()">🔄 Rafraîchir</button></div>';if(!sessData.length){html+='<div class="empty">Aucune session enregistrée.</div>';}else{html+='<div style="overflow-x:auto"><table class="resp-table"><thead><tr><th>Nom</th><th>Date</th><th>Score</th><th>%</th><th>Résultat</th><th>Durée</th></tr></thead><tbody>';sessData.slice().reverse().forEach(row=>{const c=row.c||[];const nm=c[0]?.v||'—';const dt=c[1]?.f||c[1]?.v||'—';const sc=c[2]?.v||'—';const pc=c[3]?.v||'—';const rs=c[4]?.v||'—';const du=c[5]?.v||'—';const pass=rs==='PASS';html+='<tr><td><strong>'+esc(String(nm))+'</strong></td><td>'+esc(String(dt))+'</td><td>'+esc(String(sc))+'</td><td>'+esc(String(pc))+'</td><td><span class="'+(pass?'badge-pass':'badge-fail')+'">'+rs+'</span></td><td>'+esc(String(du))+'</td></tr>';});html+='</tbody></table></div>';}html+='<h2 style="font-size:16px;color:var(--text);margin-top:32px">📝 Réponses détaillées ('+ansData.length+')</h2>';if(!ansData.length){html+='<div class="empty">Aucune réponse détaillée.</div>';}else{html+='<div style="overflow-x:auto;margin-top:12px"><table class="resp-table"><thead><tr><th>Nom</th><th>ID</th><th>Question</th><th>Réponse</th><th>Attendu</th><th>✓/✗</th><th>Pts</th></tr></thead><tbody>';ansData.slice(-100).reverse().forEach(row=>{const c=row.c||[];const nm=c[0]?.v||'';const qid=c[1]?.v||'';const qt=c[2]?.v||'';const ans=c[3]?.v||'';const cor=c[4]?.v||'';const res=c[5]?.v||'';const pts=c[6]?.v||'';const ok=res==='✓';html+='<tr><td>'+esc(String(nm))+'</td><td class="q-id">'+esc(String(qid))+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(String(qt).substring(0,80))+'</td><td style="max-width:150px">'+esc(String(ans).substring(0,60))+'</td><td style="max-width:150px">'+esc(String(cor).substring(0,60))+'</td><td>'+(ok?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--red)">✗</span>')+'</td><td>'+esc(String(pts))+'</td></tr>';});html+='</tbody></table></div>';if(ansData.length>100)html+='<div class="empty">100 dernières sur '+ansData.length+' réponses.</div>';}content.innerHTML=html;}catch(err){content.innerHTML='<div class="loading" style="color:var(--red)">Erreur : impossible de charger les réponses.<br><small style="color:var(--dim)">'+esc(err.message)+'</small><br><button class="btn btn-secondary" style="margin-top:16px" onclick="renderResponses()">Réessayer</button></div>';}}

function parseGviz(text){const m=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?$/);if(!m)return[];try{return JSON.parse(m[1]).table?.rows||[];}catch(e){return[];}}
function updateStatus(text,cls){const el=document.getElementById('status-text');if(el){el.textContent=text;el.className='status-text '+(cls||'');}}
function showToast(msg,isError){const ex=document.querySelector('.toast');if(ex)ex.remove();const d=document.createElement('div');d.className='toast'+(isError?' error':'');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}

if(checkAuth())init();
</script>
</body>
</html>
