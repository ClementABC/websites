function getPhaseForId(pid){return PHASES.find(p=>p.id===pid)||PHASES[0];}
function getPhaseLabel(pid){const p=getPhaseForId(pid);return p?`${p.emoji} ${p.title}`:'';}

function buildActiveQuestions(){
  if(!state.selectedPhases){
    state.activeQuestions=[...QUIZ.questions];
  } else {
    state.activeQuestions=QUIZ.questions.filter(q=>
      q.phase===0 || state.selectedPhases.includes(q.phase)
    );
  }
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function sendToSheets(payload){
  const url=window.__QUIZ_CONFIG.APPS_SCRIPT_URL;
  if(!url)return;
  fetch(url+'?payload='+encodeURIComponent(JSON.stringify(payload)),{method:'GET'})
    .then(r=>r.text()).then(t=>console.log('Sheets:',t)).catch(e=>console.error('Sheets error:',e));
}

          <span style="font-size:13px;font-weight:600">Phases à inclure :</span>
          <button class="btn-secondary" onclick="toggleAllPhases()" style="font-size:11px;padding:6px 12px">Tout le quiz</button>
        </div>
        <div class="phase-selector" id="phaseSelector">${phaseOpts}</div>
      </div>
      <button class="btn-primary" onclick="startQuiz()">Commencer</button>
    </div>`;
    return;
  }

  // ── End of quiz ──
  if(state.idx>=questions.length){
    let correct=0,total=0;
    questions.forEach(q=>{
      if(q.type!=='text'&&q.type!=='longtext'&&q.type!=='slider'&&q.phase!==0){
        total++;
        if(state.answers[q.id]&&state.answers[q.id].correct)correct++;
      }
    });
    const pct=total>0?Math.round(correct/total*100):0;
    const timeMin=Math.round((Date.now()-state.startTime)/60000);
    sendToSheets({action:'save_session',session:{studentName:state.name,score:correct,totalQuestions:total,timestamp:Date.now(),timeTaken:`${timeMin} min`}});
    app.innerHTML=`<div class="results">
      <div class="results-score">${correct}/${total}</div>
      <div style="color:var(--dim);font-size:18px">${pct}% • ${timeMin} min</div>
      <div style="font-size:20px;font-weight:600;margin-top:8px">${pct>=70?'Excellent ! 🎉':pct>=50?'Bien joué ! 👍':'À revoir 📚'}</div>
      <button class="btn-primary" style="margin-top:24px;max-width:200px" onclick="location.reload()">Recommencer</button>
    </div>`;
    return;
  }

  const q=questions[state.idx];
  const qIdx=state.idx;
  const totalQ=questions.length;
  const progress=Math.round((qIdx/totalQ)*100);
  const phase=getPhaseForId(q.phase);
  
  // ── Phase intro interstitial ──
  const prevQ=qIdx>0?questions[qIdx-1]:null;
  if(q.phase!==0 && (!prevQ || prevQ.phase!==q.phase)){
    let scored=0,scoredTotal=0;
    questions.slice(0,qIdx).forEach(pq=>{
      if(pq.type!=='text'&&pq.type!=='longtext'&&pq.type!=='slider'&&pq.phase!==0){
        scoredTotal++;
        if(state.answers[pq.id]&&state.answers[pq.id].correct)scored++;
      }
    });
    const scoreText=scoredTotal>0?`Score actuel : ${scored}/${scoredTotal}`:'';
    app.innerHTML=`<div class="phase-intro">
      <div class="phase-emoji">${phase.emoji}</div>
      <div class="phase-title">${phase.title}</div>
      ${phase.subtitle?`<div style="color:var(--dim);font-size:14px;margin-bottom:4px">${phase.subtitle}</div>`:''}
      <div class="phase-count">${phase.count} activités</div>
      ${scoreText?`<div class="phase-score">${scoreText}</div>`:''}
      <button class="btn-primary" style="max-width:200px" onclick="renderQuestion()">Continuer</button>
    </div>`;
    return;
  }

  renderQuestion();
}

function renderQuestion(){
  const app=document.getElementById('app');
  const questions=state.activeQuestions;
  const q=questions[state.idx];
  const qIdx=state.idx;
  const totalQ=questions.length;
  const progress=Math.round((qIdx/totalQ)*100);
  const phase=getPhaseForId(q.phase);

  // Count question within its phase
  const phaseQs=questions.filter(pq=>pq.phase===q.phase);
  const phaseIdx=phaseQs.indexOf(q)+1;

  let html=`<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text"><span>${phase.emoji} ${phase.title}</span><span>${qIdx+1}/${totalQ}</span></div>
    <div class="question-card">
    <div class="question-phase">${phase.emoji} Phase ${q.phase===0?'0':q.phase==='N'?'Noverre':q.phase} — ${phaseIdx}/${phaseQs.length}</div>
    <div class="question-text">${q.q}</div>`;

  if(q.sub) html+=`<div class="question-sub">${q.sub}</div>`;

  // ── Render by type ──
  if(q.type==='text'){
    html+=`<input class="input-field" id="answer" placeholder="${q.ph||'Votre réponse...'}" onkeydown="if(event.key==='Enter')validate()">`;
  }
  else if(q.type==='longtext'){
    html+=`<textarea class="textarea-field" id="answer" placeholder="Rédigez votre réponse ici...">${''}</textarea>`;
  }
  else if(q.type==='words'){
    const words=q.sub?q.sub.replace(/[«»]/g,'').split(/\s+/):[];
    html+='<div id="wordsPhrase" style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;font-size:15px;line-height:1.9">';
    words.forEach(w=>{
      const clean=w.replace(/[.,;:!?]/g,'');
      if(clean.length>2){
        html+=`<span class="word-chip" data-word="${clean.toLowerCase()}" onclick="toggleWord(this)">${w}</span> `;
      } else {html+=w+' ';}
    });
    html+='</div><div style="color:var(--dim);font-size:12px">Cliquez sur les mots importants</div>';
  }
  else if(q.type==='mcq'){
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" onclick="selectMCQ(this,${i})"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`;
    });
    html+='</div>';
  }
  else if(q.type==='multi'){
    selectedMulti=[];
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" onclick="toggleMulti(this,${i})"><span class="option-letter">☐</span><span>${opt}</span></button>`;
    });
    html+='</div>';
  }
  else if(q.type==='rank'){
    const shuffled=shuffle(q.items);
    html+='<div class="options-grid" id="rankList">';
    shuffled.forEach((item,i)=>{
      html+=`<div class="rank-item" draggable="true" data-text="${item}"><span class="option-letter">${i+1}</span><span>${item}</span><span class="drag-handle">⠿</span></div>`;
    });
    html+='</div><div style="color:var(--dim);font-size:12px;text-align:center;margin-top:6px">↕ Glissez les éléments pour les réordonner</div>';
  }
  else if(q.type==='match'){
    const rights=shuffle(q.pairs.map(p=>p[1]));
    html+='<div>';
    q.pairs.forEach((pair,i)=>{
      html+=`<div class="match-row"><div class="match-label">${pair[0]}</div>
        <select class="match-select" data-idx="${i}" onchange="checkMatchComplete()">
          <option value="">— Choisir —</option>
          ${rights.map(r=>`<option value="${r}">${r}</option>`).join('')}
        </select></div>`;
    });
    html+='</div>';
  }
  else if(q.type==='match3'){
    const dates=shuffle(q.rows.map(r=>r.date));
    const places=shuffle(q.rows.map(r=>r.place));
    html+='<div>';
    q.rows.forEach((row,i)=>{
      html+=`<div class="match-row" style="flex-wrap:wrap;margin-bottom:12px">
        <div class="match-label" style="flex:1 1 100%;margin-bottom:4px;font-weight:600">${row.item}</div>
        <select class="match-select match3-date" data-idx="${i}" onchange="checkMatch3Complete()">
          <option value="">— Date —</option>
          ${dates.map(d=>`<option value="${d}">${d}</option>`).join('')}
        </select>
        <select class="match-select match3-place" data-idx="${i}" onchange="checkMatch3Complete()">
          <option value="">— Lieu / Impact —</option>
          ${places.map(p=>`<option value="${p}">${p}</option>`).join('')}
        </select>
      </div>`;
    });
    html+='</div>';
  }
  else if(q.type==='geo'){
    html+='<div>';
    q.items.forEach((item,i)=>{
      const opts=shuffle(item.opts);
      html+=`<div class="match-row"><div class="match-label" style="flex:1.5">${item.text}</div>
        <select class="match-select geo-select" data-idx="${i}" onchange="checkGeoComplete()">
          <option value="">— Ville —</option>
          ${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
        </select></div>`;
    });
    html+='</div>';
  }
  else if(q.type==='truefalse'){
    html+='<div id="tfContainer">';
    q.statements.forEach((s,i)=>{
      html+=`<div class="tf-row" data-idx="${i}">
        <div class="tf-text">${i+1}. ${s.text}</div>
        <div class="tf-btns">
          <button class="tf-btn" onclick="selectTF(${i},true,this)">Vrai</button>
          <button class="tf-btn" onclick="selectTF(${i},false,this)">Faux</button>
        </div>
      </div>`;
    });
    html+='</div>';
    state.tempAnswer=new Array(q.statements.length).fill(null);
  }
  else if(q.type==='slider'){
    state.tempAnswer=3;
    html+=`<div class="slider-container">
      <div class="slider-value" id="sliderVal">3</div>
      <input type="range" class="slider-input" min="1" max="5" value="3" oninput="updateSlider(this.value)">
      <div class="slider-labels"><span>${q.labels?q.labels[0]:'1'}</span><span>${q.labels?q.labels[1]:'5'}</span></div>
    </div>`;
  }

  html+='</div>'; // close question-card

  // Nav buttons
  html+=`<div class="nav-row">`;
  if(qIdx>1) html+=`<button class="btn-secondary" onclick="prevQ()">← Retour</button>`;
  html+=`<button class="btn-primary" id="validateBtn" onclick="validate()"${q.type==='slider'?'':'disabled'}>Valider</button>`;
  html+=`</div>`;

  app.innerHTML=html;

  // Setup drag for rank
  if(q.type==='rank') setupRankDrag();
}

// ═══════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════
function startQuiz(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name)return;
  state.name=name;
  // Check which phases are selected
  const checkboxes=document.querySelectorAll('#phaseSelector input[type=checkbox]');
  const selected=Array.from(checkboxes).filter(cb=>cb.checked).map(cb=>{
    const v=cb.value;return v==='N'?'N':parseInt(v);
  });
  if(selected.length===PHASES.length-1){
    state.selectedPhases=null; // all selected
  } else {
    state.selectedPhases=selected;
  }
  buildActiveQuestions();
  state.answers['Q0']={answer:name,correct:true,ts:Date.now()};
  state.idx=1; // skip Q0
  render();
}

function toggleAllPhases(){
  const cbs=document.querySelectorAll('#phaseSelector input[type=checkbox]');
  const allChecked=Array.from(cbs).every(cb=>cb.checked);
  cbs.forEach(cb=>cb.checked=!allChecked);
}

function selectMCQ(btn,idx){
  document.querySelectorAll('.option-btn').forEach(b=>{b.classList.remove('selected');});
  btn.classList.add('selected');
  state.tempAnswer=idx;
  document.getElementById('validateBtn').disabled=false;
}

function toggleMulti(btn,idx){
  btn.classList.toggle('selected');
  if(selectedMulti.includes(idx)){
    selectedMulti=selectedMulti.filter(i=>i!==idx);
    btn.querySelector('.option-letter').textContent='☐';
  } else {
    selectedMulti.push(idx);
    btn.querySelector('.option-letter').textContent='☑';
  }
  state.tempAnswer=[...selectedMulti];
  document.getElementById('validateBtn').disabled=selectedMulti.length===0;
}

function toggleWord(el){
  el.classList.toggle('selected');
  const selected=document.querySelectorAll('.word-chip.selected');
  state.tempAnswer=Array.from(selected).map(s=>s.dataset.word);
  document.getElementById('validateBtn').disabled=selected.length===0;
}

function selectTF(idx,val,btn){
  const row=btn.closest('.tf-row');
  row.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.tempAnswer[idx]=val;
  // Enable validate if all answered
  if(state.tempAnswer.every(v=>v!==null)){
    document.getElementById('validateBtn').disabled=false;
  }
}

function updateSlider(val){
  state.tempAnswer=parseInt(val);
  document.getElementById('sliderVal').textContent=val;
}

function checkMatchComplete(){
  const selects=document.querySelectorAll('select[data-idx]');
  const allFilled=Array.from(selects).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function checkMatch3Complete(){
  const dates=document.querySelectorAll('.match3-date');
  const places=document.querySelectorAll('.match3-place');
  const allFilled=Array.from(dates).every(s=>s.value!=='')&&Array.from(places).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function checkGeoComplete(){
  const selects=document.querySelectorAll('.geo-select');
  const allFilled=Array.from(selects).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function setupRankDrag(){
  const list=document.getElementById('rankList');
  if(!list)return;
  list.querySelectorAll('[draggable]').forEach(item=>{
    item.ondragstart=e=>{dragged=item;item.style.opacity='0.5';};
    item.ondragend=()=>{item.style.opacity='1';updateRankOrder();};
    item.ondragover=e=>e.preventDefault();
    item.ondrop=e=>{
      e.preventDefault();
      if(dragged&&dragged!==item){
        const items=[...list.children];
        const dIdx=items.indexOf(dragged);
        const tIdx=items.indexOf(item);
        if(dIdx<tIdx)item.after(dragged);else item.before(dragged);
        updateRankOrder();
      }
    };
    // Touch support
    let touchY=0;
    item.ontouchstart=e=>{dragged=item;touchY=e.touches[0].clientY;item.style.opacity='0.7';};
    item.ontouchmove=e=>{
      e.preventDefault();
      const touch=e.touches[0];
      const elements=document.elementsFromPoint(touch.clientX,touch.clientY);
      const target=elements.find(el=>el.classList&&el.classList.contains('rank-item')&&el!==dragged);
      if(target){
        const rect=target.getBoundingClientRect();
        if(touch.clientY<rect.top+rect.height/2)target.before(dragged);
        else target.after(dragged);
      }
    };
    item.ontouchend=()=>{item.style.opacity='1';updateRankOrder();};
  });
  updateRankOrder();
  document.getElementById('validateBtn').disabled=false;
}

function updateRankOrder(){
  const list=document.getElementById('rankList');
  [...list.children].forEach((item,i)=>{item.querySelector('.option-letter').textContent=i+1;});
  state.tempAnswer=[...list.children].map(item=>item.dataset.text);
}

function prevQ(){if(state.idx>1){state.idx--;render();}}

// ═══════════════════════════════════════
// VALIDATION & FEEDBACK
// ═══════════════════════════════════════
function validate(){
  const questions=state.activeQuestions;
  const q=questions[state.idx];
  let answer,correct=false;
  let delay=300;

  if(q.type==='text'){
    answer=document.getElementById('answer').value.trim();
    correct=answer.length>0;
    if(q.model){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="model-answer"><div class="model-answer-label">Réponse modèle</div>${q.model}</div>`);
      delay=4000;
    }
  }
  else if(q.type==='longtext'){
    answer=document.getElementById('answer').value.trim();
    correct=answer.length>0;
    if(q.model){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="model-answer"><div class="model-answer-label">Réponse modèle</div>${q.model}</div>`);
      delay=5000;
    }
  }
  else if(q.type==='words'){
    answer=state.tempAnswer||[];
    correct=answer.length>0;
    if(q.expected){
      const container=document.getElementById('wordsPhrase');
      if(container){
        // Highlight matching words
        document.querySelectorAll('.word-chip').forEach(chip=>{
          const w=chip.dataset.word;
          if(q.expected.some(exp=>exp.toLowerCase()===w||exp.toLowerCase().includes(w)||w.includes(exp.toLowerCase()))){
            if(chip.classList.contains('selected')){
              chip.style.background='var(--green-glow)';chip.style.borderColor='var(--green)';chip.style.color='var(--green)';
            }
          }
        });
        const card=document.querySelector('.question-card');
        card.insertAdjacentHTML('beforeend',`<div class="expected-box"><div class="expected-label">Mots attendus :</div><div class="expected-tags">${q.expected.map(w=>`<span class="expected-tag">${w}</span>`).join('')}</div></div>`);
      }
    }
    delay=4000;
  }
  else if(q.type==='mcq'){
    answer=state.tempAnswer;
    correct=answer===q.a;
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.style.pointerEvents='none';
      if(i===q.a)btn.classList.add('correct');
      else if(i===answer)btn.classList.add('incorrect');
    });
    delay=1500;
  }
  else if(q.type==='multi'){
    answer=state.tempAnswer||[];
    correct=JSON.stringify([...answer].sort())===JSON.stringify([...q.a].sort());
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.style.pointerEvents='none';
      if(q.a.includes(i))btn.classList.add('correct');
      else if(answer.includes(i))btn.classList.add('incorrect');
    });
    delay=1500;
  }
  else if(q.type==='rank'){
    answer=state.tempAnswer;
    correct=JSON.stringify(answer)===JSON.stringify(q.answer);
    const items=document.querySelectorAll('.rank-item');
    items.forEach((item,i)=>{
      if(item.dataset.text===q.answer[i])item.classList.add('correct');
      else item.classList.add('incorrect');
    });
    if(!correct){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="correct-order"><div class="correct-order-label">Ordre correct :</div>${q.answer.map((a,i)=>`<div class="correct-order-item">${i+1}. ${a}</div>`).join('')}</div>`);
      delay=3000;
    } else {delay=1500;}
  }
  else if(q.type==='match'){
    const selects=document.querySelectorAll('select[data-idx]');
    answer=Array.from(selects).map(s=>s.value);
    correct=answer.every((v,i)=>v===q.pairs[i][1]);
    selects.forEach((sel,i)=>{
      sel.disabled=true;
      const label=sel.closest('.match-row').querySelector('.match-label');
      if(sel.value===q.pairs[i][1]){sel.classList.add('correct');label.classList.add('correct');}
      else{sel.classList.add('incorrect');label.classList.add('incorrect');}
    });
    delay=2000;
  }
  else if(q.type==='match3'){
    const dates=document.querySelectorAll('.match3-date');
    const places=document.querySelectorAll('.match3-place');
    answer={dates:Array.from(dates).map(s=>s.value),places:Array.from(places).map(s=>s.value)};
    let allCorrect=true;
    dates.forEach((sel,i)=>{
      sel.disabled=true;
      if(sel.value===q.rows[i].date)sel.classList.add('correct');
      else{sel.classList.add('incorrect');allCorrect=false;}
    });
    places.forEach((sel,i)=>{
      sel.disabled=true;
      if(sel.value===q.rows[i].place)sel.classList.add('correct');
      else{sel.classList.add('incorrect');allCorrect=false;}
    });
    correct=allCorrect;
    delay=2500;
  }
  else if(q.type==='geo'){
    const selects=document.querySelectorAll('.geo-select');
    answer=Array.from(selects).map(s=>s.value);
    correct=answer.every((v,i)=>v===q.items[i].answer);
    selects.forEach((sel,i)=>{
      sel.disabled=true;
      const label=sel.closest('.match-row').querySelector('.match-label');
      if(sel.value===q.items[i].answer){sel.classList.add('correct');label.classList.add('correct');}
      else{sel.classList.add('incorrect');label.classList.add('incorrect');}
    });
    delay=2000;
  }
  else if(q.type==='truefalse'){
    answer=state.tempAnswer;
    let allCorrect=true;
    const rows=document.querySelectorAll('.tf-row');
    rows.forEach((row,i)=>{
      const btns=row.querySelectorAll('.tf-btn');
      btns.forEach(btn=>btn.style.pointerEvents='none');
      const isCorrect=answer[i]===q.statements[i].answer;
      if(!isCorrect)allCorrect=false;
      row.classList.add(isCorrect?'correct':'incorrect');
      // Highlight the correct button
      btns.forEach(btn=>{
        const btnVal=btn.textContent==='Vrai';
        if(btnVal===q.statements[i].answer)btn.classList.add('correct');
        else if(btn.classList.contains('selected')&&!isCorrect)btn.classList.add('incorrect');
      });
      // Show explanation if exists
      if(!isCorrect&&q.statements[i].explain){
        row.insertAdjacentHTML('beforeend',`<div style="width:100%;font-size:11px;color:var(--gold);margin-top:4px;padding-left:4px">→ ${q.statements[i].explain}</div>`);
      }
    });
    correct=allCorrect;
    delay=2500;
  }
  else if(q.type==='slider'){
    answer=state.tempAnswer;
    correct=null; // no correct answer
    if(q.hint){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div style="text-align:center;color:var(--dim);font-size:12px;margin-top:8px">${q.hint}</div>`);
      delay=1500;
    }
  }

  // Save answer
  state.answers[q.id]={answer,correct,ts:Date.now()};

  // Send to sheets
  if(q.phase!==0){
    sendToSheets({action:'save_answer',answer:{
      studentName:state.name,
      questionId:q.id,
      questionText:q.q,
      studentAnswer:answer,
      correctAnswer:q.a||q.answer||q.expected||'',
      questionType:q.type,
      isCorrect:correct,
      points:correct?1:0,
      maxPoints:(q.type==='slider'||q.type==='longtext')?0:1
    }});
  }

  // Disable validate button and show "Suivant" button
  document.getElementById('validateBtn').disabled=true;
  document.getElementById('validateBtn').style.display='none';

  // Show next button after feedback delay
  setTimeout(()=>{
    const navRow=document.querySelector('.nav-row');
    if(navRow){
      const nextBtn=document.createElement('button');
      nextBtn.className='btn-primary';
      nextBtn.textContent='Suivant →';
      nextBtn.onclick=()=>{
        state.idx++;
        state.tempAnswer=null;
        selectedMulti=[];
        render();
      };
      navRow.appendChild(nextBtn);
    }
  },delay);
}
