<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Quiz — Du ballet de cour au ballet d'action</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:rgba(255,255,255,0.04);--surface-2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--text:#e8e6e3;--dim:rgba(255,255,255,0.5);--purple:#9b6dff;--purple-glow:rgba(155,109,255,0.15);--gold:#d4a853;--gold-glow:rgba(212,168,83,0.15);--green:#4ade80;--green-glow:rgba(74,222,128,0.15);--red:#f87171;--red-glow:rgba(248,113,113,0.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.quiz-container{max-width:680px;margin:0 auto;padding:16px;min-height:100vh}
.quiz-content{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.welcome{text-align:center;padding:40px 0}
.welcome-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.welcome-sub{color:var(--dim);font-size:14px;margin-bottom:32px;line-height:1.6}
.input-field{width:100%;padding:14px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;transition:border-color .2s}
.input-field:focus{outline:none;border-color:var(--purple)}
.textarea-field{width:100%;padding:14px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;min-height:120px;resize:vertical;transition:border-color .2s}
.textarea-field:focus{outline:none;border-color:var(--purple)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#7c4dff);color:white;border:none;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;width:100%}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(155,109,255,0.3)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-secondary:hover{background:var(--surface);border-color:var(--purple)}
.progress-bar{background:var(--surface-2);border-radius:20px;height:6px;margin-bottom:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:20px;transition:width .4s ease}
.progress-text{font-size:11px;color:var(--dim);margin-bottom:16px;display:flex;justify-content:space-between}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
.question-phase{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.question-number{font-size:12px;color:var(--dim);margin-bottom:6px}
.question-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;line-height:1.4;margin-bottom:16px}
.question-sub{color:var(--dim);font-size:14px;font-style:italic;margin-bottom:16px;padding:12px;background:var(--surface-2);border-radius:8px;line-height:1.6}
.option-btn{width:100%;text-align:left;padding:12px 16px;background:var(--surface-2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;cursor:pointer;margin-bottom:8px;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:10px}
.option-btn:hover{border-color:var(--purple);background:var(--purple-glow)}
.option-btn.selected{border-color:var(--purple);background:var(--purple-glow)}
.option-btn.correct{border-color:var(--green)!important;background:var(--green-glow)!important;color:var(--green)!important}
.option-btn.incorrect{border-color:var(--red)!important;background:var(--red-glow)!important;color:var(--red)!important}
.option-letter{width:28px;height:28px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.options-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.match-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.match-label{flex:1;font-size:13px;min-width:120px;padding:8px;background:var(--surface-2);border-radius:8px;border:2px solid transparent}
.match-select{flex:1;padding:10px;background:var(--surface-2);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;min-width:140px}
.match-select:focus{outline:none;border-color:var(--purple)}
.match-select.correct{border-color:var(--green)!important;background:var(--green-glow)!important}
.match-select.incorrect{border-color:var(--red)!important;background:var(--red-glow)!important}
.match-label.correct{border-color:var(--green)!important;background:var(--green-glow)!important}
.match-label.incorrect{border-color:var(--red)!important;background:var(--red-glow)!important}
.tf-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:10px;background:var(--surface-2);border-radius:10px;border:2px solid transparent}
.tf-text{flex:1;font-size:13px;line-height:1.4}
.tf-btns{display:flex;gap:6px;flex-shrink:0}
.tf-btn{padding:6px 14px;border-radius:8px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.tf-btn.selected{border-color:var(--purple);background:var(--purple-glow);color:var(--purple)}
.tf-btn.correct{border-color:var(--green)!important;background:var(--green-glow)!important;color:var(--green)!important}
.tf-btn.incorrect{border-color:var(--red)!important;background:var(--red-glow)!important;color:var(--red)!important}
.tf-row.correct{border-color:var(--green)!important}
.tf-row.incorrect{border-color:var(--red)!important}
.slider-container{padding:16px 0}
.slider-input{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:var(--surface-2);outline:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--purple);cursor:pointer;box-shadow:0 2px 8px rgba(155,109,255,0.4)}
.slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:8px}
.slider-value{text-align:center;font-size:32px;font-weight:700;color:var(--purple);margin-bottom:12px}
.phase-intro{text-align:center;padding:48px 16px}
.phase-emoji{font-size:48px;margin-bottom:16px}
.phase-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;margin-bottom:8px}
.phase-subtitle{color:var(--dim);font-size:14px;margin-bottom:8px}
.phase-count{color:var(--gold);font-size:13px;font-weight:600;margin-bottom:24px}
.phase-score{color:var(--dim);font-size:13px;margin-bottom:24px}
.results{text-align:center;padding:40px 0}
.results-score{font-family:'Playfair Display',serif;font-size:48px;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.word-chip{display:inline-block;padding:4px 8px;margin:2px;border-radius:6px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.word-chip.selected{background:var(--purple-glow);border-color:var(--purple);color:var(--purple)}
.phase-selector{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.phase-option{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s}
.phase-option:hover{border-color:var(--purple)}
.phase-option.selected{border-color:var(--purple);background:var(--purple-glow)}
.phase-option input[type=checkbox]{accent-color:var(--purple);width:18px;height:18px}
.phase-option-text{flex:1}
.phase-option-title{font-size:14px;font-weight:600}
.phase-option-count{font-size:12px;color:var(--dim)}
.nav-row{display:flex;gap:8px;margin-top:16px}
.nav-row .btn-primary{flex:1}
.nav-row .btn-secondary{flex:0 0 auto}
.rank-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-2);border:2px solid var(--border);border-radius:10px;cursor:grab;user-select:none;transition:all .2s}
.rank-item:active{cursor:grabbing}
.rank-item .drag-handle{margin-left:auto;color:var(--dim);font-size:16px;flex-shrink:0;letter-spacing:-2px}
.rank-item.correct{border-color:var(--green)!important;background:var(--green-glow)!important}
.rank-item.incorrect{border-color:var(--red)!important;background:var(--red-glow)!important}
.expected-box{margin-top:16px;padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.expected-label{color:var(--dim);font-size:12px;margin-bottom:8px}
.expected-tags{display:flex;flex-wrap:wrap;gap:6px}
.expected-tag{padding:4px 10px;background:var(--purple-glow);color:var(--purple);border-radius:12px;font-size:12px;font-weight:600}
.model-answer{margin-top:12px;padding:12px;background:var(--gold-glow);border:1px solid rgba(212,168,83,0.3);border-radius:8px;font-size:13px;line-height:1.5;color:var(--gold)}
.model-answer-label{font-weight:600;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.correct-order{margin-top:12px;padding:12px;background:var(--green-glow);border:1px solid rgba(74,222,128,0.2);border-radius:8px}
.correct-order-label{font-size:11px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.correct-order-item{font-size:13px;color:var(--green);padding:2px 0}
select option{background:#1a1a2e;color:var(--text)}
/* ── Editor styles ── */
.editor-header{text-align:center;padding:24px 0;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border)}
.editor-header .welcome-title{margin-bottom:4px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.editor-actions .btn-secondary{font-size:12px;padding:8px 14px}
.phase-group{margin-bottom:24px}
.phase-group-header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;cursor:pointer;user-select:none;transition:all .2s;margin-bottom:8px}
.phase-group-header:hover{border-color:var(--purple)}
.phase-group-header .arrow{transition:transform .2s;font-size:12px;color:var(--dim)}
.phase-group-header .arrow.open{transform:rotate(90deg)}
.phase-group-header .phase-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;flex:1}
.phase-group-header .phase-badge{font-size:11px;color:var(--dim);background:var(--surface);padding:3px 8px;border-radius:6px}
.phase-group-body{display:none;padding-left:0}
.phase-group-body.open{display:block}
.eq-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.eq-card.modified{border-color:var(--green)}
.eq-card-header{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
.eq-card-header:hover{background:var(--surface-2)}
.eq-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.eq-badge.type{background:var(--purple-glow);color:var(--purple)}
.eq-badge.id{background:var(--surface-2);color:var(--dim)}
.eq-badge.mod{background:var(--green-glow);color:var(--green)}
.eq-preview{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-card-body{display:none;padding:16px;border-top:1px solid var(--border)}
.eq-card-body.open{display:block}
.eq-field{margin-bottom:14px}
.eq-field label{display:block;font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.eq-field .input-field,.eq-field .textarea-field{font-size:13px;padding:10px 12px}
.eq-field .textarea-field{min-height:70px}
.eq-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.eq-row .input-field{flex:1;padding:8px 10px;font-size:12px}
.eq-row-actions{display:flex;gap:4px;flex-shrink:0}
.eq-row-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.eq-row-btn:hover{border-color:var(--purple);color:var(--purple)}
.eq-row-btn.del:hover{border-color:var(--red);color:var(--red)}
.eq-card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.eq-card-actions .btn-primary{font-size:12px;padding:8px 16px;width:auto}
.eq-card-actions .btn-secondary{font-size:12px;padding:8px 16px}
.tf-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;font-size:11px}
.tf-toggle span{padding:4px 10px;cursor:pointer;transition:all .2s}
.tf-toggle span.active-true{background:var(--green-glow);color:var(--green);font-weight:600}
.tf-toggle span.active-false{background:var(--red-glow);color:var(--red);font-weight:600}
.eq-correct-radio{width:16px;height:16px;accent-color:var(--green);flex-shrink:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;animation:fadeIn .3s ease}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="quiz-content" id="app"></div>
</div>
<script>
window.__QUIZ_CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwb4ZdA_PvAzGBCdrTdetjjI8er3JLgZIIR7MPcTUiZOUhn14QoJ_LleGyX9-RQ1TNN/exec'
};
</script>
<script>
// ═══════════════════════════════════════
// LOAD QUESTIONS FROM JSON
// ═══════════════════════════════════════
let PHASES = [];
let QUIZ = { title: '', subtitle: '', questions: [] };

(async function loadAndInit() {
  const app = document.getElementById('app');
  app.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div class="welcome-title">Chargement du quiz…</div></div>';
  
  try {
    const resp = await fetch('questions.json?v=' + Date.now());
    if (!resp.ok) throw new Error('Erreur réseau');
    const data = await resp.json();
    PHASES = data.phases;
    QUIZ = { title: data.title, subtitle: data.subtitle, questions: data.questions };
    startQuiz();
  } catch (err) {
    app.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div class="welcome-title" style="-webkit-text-fill-color:var(--red)">Erreur de chargement</div><p style="color:var(--dim);margin-top:12px;">Impossible de charger les questions. Réessayez plus tard.</p><button class="btn-primary" style="max-width:200px;margin:24px auto" onclick="location.reload()">Réessayer</button></div>';
    console.error('Failed to load questions:', err);
  }
})();

function startQuiz() {

// ═══════════════════════════════════════
// STATE & HELPERS
// ═══════════════════════════════════════
const state = {
  name:'',sessionId:Date.now().toString(36),idx:0,answers:{},tempAnswer:null,
  selectedPhases:null, // null = all, or array of phase ids
  activeQuestions:[], // filtered questions based on phase selection
  startTime:Date.now()
};
let selectedMulti=[];
let dragged=null;

function getPhaseForId(pid){return PHASES.find(p=>p.id===pid)||PHASES[0];}
function getPhaseLabel(pid){const p=getPhaseForId(pid);return p?`${p.emoji} ${p.title}`:'';}

function getQuestions(){
  const overrides=JSON.parse(localStorage.getItem('quiz-overrides')||'{}');
  return QUIZ.questions.map(q=>overrides[q.id]?{...q,...overrides[q.id]}:q);
}

function buildActiveQuestions(){
  const questions=getQuestions();
  if(!state.selectedPhases){
    state.activeQuestions=[...questions];
  } else {
    state.activeQuestions=questions.filter(q=>
      q.phase===0 || state.selectedPhases.includes(q.phase)
    );
  }
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function sendToSheets(payload){
  const url=window.__QUIZ_CONFIG.APPS_SCRIPT_URL;
  if(!url)return;
  fetch(url+'?payload='+encodeURIComponent(JSON.stringify(payload)),{method:'GET'})
    .then(r=>r.text()).then(t=>console.log('Sheets:',t)).catch(e=>console.error('Sheets error:',e));
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  const app=document.getElementById('app');
  const questions=state.activeQuestions;
  
  // ── Welcome screen with phase selector ──
  if(state.idx===0 && !state.name){
    let phaseOpts='';
    PHASES.filter(p=>p.id!==0).forEach(p=>{
      phaseOpts+=`<label class="phase-option">
        <input type="checkbox" value="${p.id}" checked>
        <div class="phase-option-text">
          <div class="phase-option-title">${p.emoji} ${p.title}</div>
          <div class="phase-option-count">${p.count} activités${p.subtitle?' — '+p.subtitle:''}</div>
        </div>
      </label>`;
    });
    app.innerHTML=`<div class="welcome">
      <div class="welcome-title">${QUIZ.title}</div>
      <div class="welcome-sub">${QUIZ.subtitle}<br><br>59 activités • 7 phases • ~30 min</div>
      <input class="input-field" id="nameInput" placeholder="Ton prénom" style="margin-bottom:16px"
        onkeydown="if(event.key==='Enter')beginQuiz()">
      <div style="text-align:left;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:600">Phases à inclure :</span>
          <button class="btn-secondary" onclick="toggleAllPhases()" style="font-size:11px;padding:6px 12px">Tout le quiz</button>
        </div>
        <div class="phase-selector" id="phaseSelector">${phaseOpts}</div>
      </div>
      <button class="btn-primary" onclick="beginQuiz()">Commencer</button>
    </div>`;
    return;
  }

  // ── End of quiz ──
  if(state.idx>=questions.length){
    let correct=0,total=0;
    questions.forEach(q=>{
      if(q.type!=='text'&&q.type!=='longtext'&&q.type!=='slider'&&q.phase!==0){
        total++;
        if(state.answers[q.id]&&state.answers[q.id].correct)correct++;
      }
    });
    const pct=total>0?Math.round(correct/total*100):0;
    const timeMin=Math.round((Date.now()-state.startTime)/60000);
    sendToSheets({action:'save_session',session:{studentName:state.name,score:correct,totalQuestions:total,timestamp:Date.now(),timeTaken:`${timeMin} min`}});
    app.innerHTML=`<div class="results">
      <div class="results-score">${correct}/${total}</div>
      <div style="color:var(--dim);font-size:18px">${pct}% • ${timeMin} min</div>
      <div style="font-size:20px;font-weight:600;margin-top:8px">${pct>=70?'Excellent ! 🎉':pct>=50?'Bien joué ! 👍':'À revoir 📚'}</div>
      <button class="btn-primary" style="margin-top:24px;max-width:200px" onclick="location.reload()">Recommencer</button>
    </div>`;
    return;
  }

  const q=questions[state.idx];
  const qIdx=state.idx;
  const totalQ=questions.length;
  const progress=Math.round((qIdx/totalQ)*100);
  const phase=getPhaseForId(q.phase);
  
  // ── Phase intro interstitial ──
  const prevQ=qIdx>0?questions[qIdx-1]:null;
  if(q.phase!==0 && (!prevQ || prevQ.phase!==q.phase)){
    let scored=0,scoredTotal=0;
    questions.slice(0,qIdx).forEach(pq=>{
      if(pq.type!=='text'&&pq.type!=='longtext'&&pq.type!=='slider'&&pq.phase!==0){
        scoredTotal++;
        if(state.answers[pq.id]&&state.answers[pq.id].correct)scored++;
      }
    });
    const scoreText=scoredTotal>0?`Score actuel : ${scored}/${scoredTotal}`:'';
    app.innerHTML=`<div class="phase-intro">
      <div class="phase-emoji">${phase.emoji}</div>
      <div class="phase-title">${phase.title}</div>
      ${phase.subtitle?`<div style="color:var(--dim);font-size:14px;margin-bottom:4px">${phase.subtitle}</div>`:''}
      <div class="phase-count">${phase.count} activités</div>
      ${scoreText?`<div class="phase-score">${scoreText}</div>`:''}
      <button class="btn-primary" style="max-width:200px" onclick="renderQuestion()">Continuer</button>
    </div>`;
    return;
  }

  renderQuestion();
}

function renderQuestion(){
  const app=document.getElementById('app');
  const questions=state.activeQuestions;
  const q=questions[state.idx];
  const qIdx=state.idx;
  const totalQ=questions.length;
  const progress=Math.round((qIdx/totalQ)*100);
  const phase=getPhaseForId(q.phase);

  // Count question within its phase
  const phaseQs=questions.filter(pq=>pq.phase===q.phase);
  const phaseIdx=phaseQs.indexOf(q)+1;

  let html=`<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text"><span>${phase.emoji} ${phase.title}</span><span>${qIdx+1}/${totalQ}</span></div>
    <div class="question-card">
    <div class="question-phase">${phase.emoji} Phase ${q.phase===0?'0':q.phase==='N'?'Noverre':q.phase} — ${phaseIdx}/${phaseQs.length}</div>
    <div class="question-text">${q.q}</div>`;

  if(q.sub) html+=`<div class="question-sub">${q.sub}</div>`;

  // ── Render by type ──
  if(q.type==='text'){
    html+=`<input class="input-field" id="answer" placeholder="${q.ph||'Votre réponse...'}" onkeydown="if(event.key==='Enter')validate()">`;
  }
  else if(q.type==='longtext'){
    html+=`<textarea class="textarea-field" id="answer" placeholder="Rédigez votre réponse ici...">${''}</textarea>`;
  }
  else if(q.type==='words'){
    const words=q.sub?q.sub.replace(/[«»]/g,'').split(/\s+/):[];
    html+='<div id="wordsPhrase" style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;font-size:15px;line-height:1.9">';
    words.forEach(w=>{
      const clean=w.replace(/[.,;:!?]/g,'');
      if(clean.length>2){
        html+=`<span class="word-chip" data-word="${clean.toLowerCase()}" onclick="toggleWord(this)">${w}</span> `;
      } else {html+=w+' ';}
    });
    html+='</div><div style="color:var(--dim);font-size:12px">Cliquez sur les mots importants</div>';
  }
  else if(q.type==='mcq'){
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" onclick="selectMCQ(this,${i})"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`;
    });
    html+='</div>';
  }
  else if(q.type==='multi'){
    selectedMulti=[];
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" onclick="toggleMulti(this,${i})"><span class="option-letter">☐</span><span>${opt}</span></button>`;
    });
    html+='</div>';
  }
  else if(q.type==='rank'){
    const shuffled=shuffle(q.items);
    html+='<div class="options-grid" id="rankList">';
    shuffled.forEach((item,i)=>{
      html+=`<div class="rank-item" draggable="true" data-text="${item}"><span class="option-letter">${i+1}</span><span>${item}</span><span class="drag-handle">⠿</span></div>`;
    });
    html+='</div><div style="color:var(--dim);font-size:12px;text-align:center;margin-top:6px">↕ Glissez les éléments pour les réordonner</div>';
  }
  else if(q.type==='match'){
    const rights=shuffle(q.pairs.map(p=>p[1]));
    html+='<div>';
    q.pairs.forEach((pair,i)=>{
      html+=`<div class="match-row"><div class="match-label">${pair[0]}</div>
        <select class="match-select" data-idx="${i}" onchange="checkMatchComplete()">
          <option value="">— Choisir —</option>
          ${rights.map(r=>`<option value="${r}">${r}</option>`).join('')}
        </select></div>`;
    });
    html+='</div>';
  }
  else if(q.type==='match3'){
    const dates=shuffle(q.rows.map(r=>r.date));
    const places=shuffle(q.rows.map(r=>r.place));
    html+='<div>';
    q.rows.forEach((row,i)=>{
      html+=`<div class="match-row" style="flex-wrap:wrap;margin-bottom:12px">
        <div class="match-label" style="flex:1 1 100%;margin-bottom:4px;font-weight:600">${row.item}</div>
        <select class="match-select match3-date" data-idx="${i}" onchange="checkMatch3Complete()">
          <option value="">— Date —</option>
          ${dates.map(d=>`<option value="${d}">${d}</option>`).join('')}
        </select>
        <select class="match-select match3-place" data-idx="${i}" onchange="checkMatch3Complete()">
          <option value="">— Lieu / Impact —</option>
          ${places.map(p=>`<option value="${p}">${p}</option>`).join('')}
        </select>
      </div>`;
    });
    html+='</div>';
  }
  else if(q.type==='geo'){
    html+='<div>';
    q.items.forEach((item,i)=>{
      const opts=shuffle(item.opts);
      html+=`<div class="match-row"><div class="match-label" style="flex:1.5">${item.text}</div>
        <select class="match-select geo-select" data-idx="${i}" onchange="checkGeoComplete()">
          <option value="">— Ville —</option>
          ${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
        </select></div>`;
    });
    html+='</div>';
  }
  else if(q.type==='truefalse'){
    html+='<div id="tfContainer">';
    q.statements.forEach((s,i)=>{
      html+=`<div class="tf-row" data-idx="${i}">
        <div class="tf-text">${i+1}. ${s.text}</div>
        <div class="tf-btns">
          <button class="tf-btn" onclick="selectTF(${i},true,this)">Vrai</button>
          <button class="tf-btn" onclick="selectTF(${i},false,this)">Faux</button>
        </div>
      </div>`;
    });
    html+='</div>';
    state.tempAnswer=new Array(q.statements.length).fill(null);
  }
  else if(q.type==='slider'){
    state.tempAnswer=3;
    html+=`<div class="slider-container">
      <div class="slider-value" id="sliderVal">3</div>
      <input type="range" class="slider-input" min="1" max="5" value="3" oninput="updateSlider(this.value)">
      <div class="slider-labels"><span>${q.labels?q.labels[0]:'1'}</span><span>${q.labels?q.labels[1]:'5'}</span></div>
    </div>`;
  }

  html+='</div>'; // close question-card

  // Nav buttons
  html+=`<div class="nav-row">`;
  if(qIdx>1) html+=`<button class="btn-secondary" onclick="prevQ()">← Retour</button>`;
  html+=`<button class="btn-primary" id="validateBtn" onclick="validate()"${q.type==='slider'?'':'disabled'}>Valider</button>`;
  html+=`</div>`;

  app.innerHTML=html;

  // Setup drag for rank
  if(q.type==='rank') setupRankDrag();
}

// ═══════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════
window.beginQuiz = function(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name)return;
  state.name=name;
  // Check which phases are selected
  const checkboxes=document.querySelectorAll('#phaseSelector input[type=checkbox]');
  const selected=Array.from(checkboxes).filter(cb=>cb.checked).map(cb=>{
    const v=cb.value;return v==='N'?'N':parseInt(v);
  });
  if(selected.length===PHASES.length-1){
    state.selectedPhases=null; // all selected
  } else {
    state.selectedPhases=selected;
  }
  buildActiveQuestions();
  state.answers['Q0']={answer:name,correct:true,ts:Date.now()};
  state.idx=1; // skip Q0
  render();
}

function toggleAllPhases(){
  const cbs=document.querySelectorAll('#phaseSelector input[type=checkbox]');
  const allChecked=Array.from(cbs).every(cb=>cb.checked);
  cbs.forEach(cb=>cb.checked=!allChecked);
}

function selectMCQ(btn,idx){
  document.querySelectorAll('.option-btn').forEach(b=>{b.classList.remove('selected');});
  btn.classList.add('selected');
  state.tempAnswer=idx;
  document.getElementById('validateBtn').disabled=false;
}

function toggleMulti(btn,idx){
  btn.classList.toggle('selected');
  if(selectedMulti.includes(idx)){
    selectedMulti=selectedMulti.filter(i=>i!==idx);
    btn.querySelector('.option-letter').textContent='☐';
  } else {
    selectedMulti.push(idx);
    btn.querySelector('.option-letter').textContent='☑';
  }
  state.tempAnswer=[...selectedMulti];
  document.getElementById('validateBtn').disabled=selectedMulti.length===0;
}

function toggleWord(el){
  el.classList.toggle('selected');
  const selected=document.querySelectorAll('.word-chip.selected');
  state.tempAnswer=Array.from(selected).map(s=>s.dataset.word);
  document.getElementById('validateBtn').disabled=selected.length===0;
}

function selectTF(idx,val,btn){
  const row=btn.closest('.tf-row');
  row.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.tempAnswer[idx]=val;
  // Enable validate if all answered
  if(state.tempAnswer.every(v=>v!==null)){
    document.getElementById('validateBtn').disabled=false;
  }
}

function updateSlider(val){
  state.tempAnswer=parseInt(val);
  document.getElementById('sliderVal').textContent=val;
}

function checkMatchComplete(){
  const selects=document.querySelectorAll('select[data-idx]');
  const allFilled=Array.from(selects).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function checkMatch3Complete(){
  const dates=document.querySelectorAll('.match3-date');
  const places=document.querySelectorAll('.match3-place');
  const allFilled=Array.from(dates).every(s=>s.value!=='')&&Array.from(places).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function checkGeoComplete(){
  const selects=document.querySelectorAll('.geo-select');
  const allFilled=Array.from(selects).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
}

function setupRankDrag(){
  const list=document.getElementById('rankList');
  if(!list)return;
  list.querySelectorAll('[draggable]').forEach(item=>{
    item.ondragstart=e=>{dragged=item;item.style.opacity='0.5';};
    item.ondragend=()=>{item.style.opacity='1';updateRankOrder();};
    item.ondragover=e=>e.preventDefault();
    item.ondrop=e=>{
      e.preventDefault();
      if(dragged&&dragged!==item){
        const items=[...list.children];
        const dIdx=items.indexOf(dragged);
        const tIdx=items.indexOf(item);
        if(dIdx<tIdx)item.after(dragged);else item.before(dragged);
        updateRankOrder();
      }
    };
    // Touch support
    let touchY=0;
    item.ontouchstart=e=>{dragged=item;touchY=e.touches[0].clientY;item.style.opacity='0.7';};
    item.ontouchmove=e=>{
      e.preventDefault();
      const touch=e.touches[0];
      const elements=document.elementsFromPoint(touch.clientX,touch.clientY);
      const target=elements.find(el=>el.classList&&el.classList.contains('rank-item')&&el!==dragged);
      if(target){
        const rect=target.getBoundingClientRect();
        if(touch.clientY<rect.top+rect.height/2)target.before(dragged);
        else target.after(dragged);
      }
    };
    item.ontouchend=()=>{item.style.opacity='1';updateRankOrder();};
  });
  updateRankOrder();
  document.getElementById('validateBtn').disabled=false;
}

function updateRankOrder(){
  const list=document.getElementById('rankList');
  [...list.children].forEach((item,i)=>{item.querySelector('.option-letter').textContent=i+1;});
  state.tempAnswer=[...list.children].map(item=>item.dataset.text);
}

function prevQ(){if(state.idx>1){state.idx--;render();}}

// ═══════════════════════════════════════
// VALIDATION & FEEDBACK
// ═══════════════════════════════════════
function validate(){
  const questions=state.activeQuestions;
  const q=questions[state.idx];
  let answer,correct=false;
  let delay=300;

  if(q.type==='text'){
    answer=document.getElementById('answer').value.trim();
    correct=answer.length>0;
    if(q.model){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="model-answer"><div class="model-answer-label">Réponse modèle</div>${q.model}</div>`);
      delay=4000;
    }
  }
  else if(q.type==='longtext'){
    answer=document.getElementById('answer').value.trim();
    correct=answer.length>0;
    if(q.model){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="model-answer"><div class="model-answer-label">Réponse modèle</div>${q.model}</div>`);
      delay=5000;
    }
  }
  else if(q.type==='words'){
    answer=state.tempAnswer||[];
    correct=answer.length>0;
    if(q.expected){
      const container=document.getElementById('wordsPhrase');
      if(container){
        // Highlight matching words
        document.querySelectorAll('.word-chip').forEach(chip=>{
          const w=chip.dataset.word;
          if(q.expected.some(exp=>exp.toLowerCase()===w||exp.toLowerCase().includes(w)||w.includes(exp.toLowerCase()))){
            if(chip.classList.contains('selected')){
              chip.style.background='var(--green-glow)';chip.style.borderColor='var(--green)';chip.style.color='var(--green)';
            }
          }
        });
        const card=document.querySelector('.question-card');
        card.insertAdjacentHTML('beforeend',`<div class="expected-box"><div class="expected-label">Mots attendus :</div><div class="expected-tags">${q.expected.map(w=>`<span class="expected-tag">${w}</span>`).join('')}</div></div>`);
      }
    }
    delay=4000;
  }
  else if(q.type==='mcq'){
    answer=state.tempAnswer;
    correct=answer===q.a;
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.style.pointerEvents='none';
      if(i===q.a)btn.classList.add('correct');
      else if(i===answer)btn.classList.add('incorrect');
    });
    delay=1500;
  }
  else if(q.type==='multi'){
    answer=state.tempAnswer||[];
    correct=JSON.stringify([...answer].sort())===JSON.stringify([...q.a].sort());
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.style.pointerEvents='none';
      if(q.a.includes(i))btn.classList.add('correct');
      else if(answer.includes(i))btn.classList.add('incorrect');
    });
    delay=1500;
  }
  else if(q.type==='rank'){
    answer=state.tempAnswer;
    correct=JSON.stringify(answer)===JSON.stringify(q.answer);
    const items=document.querySelectorAll('.rank-item');
    items.forEach((item,i)=>{
      if(item.dataset.text===q.answer[i])item.classList.add('correct');
      else item.classList.add('incorrect');
    });
    if(!correct){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div class="correct-order"><div class="correct-order-label">Ordre correct :</div>${q.answer.map((a,i)=>`<div class="correct-order-item">${i+1}. ${a}</div>`).join('')}</div>`);
      delay=3000;
    } else {delay=1500;}
  }
  else if(q.type==='match'){
    const selects=document.querySelectorAll('select[data-idx]');
    answer=Array.from(selects).map(s=>s.value);
    correct=answer.every((v,i)=>v===q.pairs[i][1]);
    selects.forEach((sel,i)=>{
      sel.disabled=true;
      const label=sel.closest('.match-row').querySelector('.match-label');
      if(sel.value===q.pairs[i][1]){sel.classList.add('correct');label.classList.add('correct');}
      else{sel.classList.add('incorrect');label.classList.add('incorrect');}
    });
    delay=2000;
  }
  else if(q.type==='match3'){
    const dates=document.querySelectorAll('.match3-date');
    const places=document.querySelectorAll('.match3-place');
    answer={dates:Array.from(dates).map(s=>s.value),places:Array.from(places).map(s=>s.value)};
    let allCorrect=true;
    dates.forEach((sel,i)=>{
      sel.disabled=true;
      if(sel.value===q.rows[i].date)sel.classList.add('correct');
      else{sel.classList.add('incorrect');allCorrect=false;}
    });
    places.forEach((sel,i)=>{
      sel.disabled=true;
      if(sel.value===q.rows[i].place)sel.classList.add('correct');
      else{sel.classList.add('incorrect');allCorrect=false;}
    });
    correct=allCorrect;
    delay=2500;
  }
  else if(q.type==='geo'){
    const selects=document.querySelectorAll('.geo-select');
    answer=Array.from(selects).map(s=>s.value);
    correct=answer.every((v,i)=>v===q.items[i].answer);
    selects.forEach((sel,i)=>{
      sel.disabled=true;
      const label=sel.closest('.match-row').querySelector('.match-label');
      if(sel.value===q.items[i].answer){sel.classList.add('correct');label.classList.add('correct');}
      else{sel.classList.add('incorrect');label.classList.add('incorrect');}
    });
    delay=2000;
  }
  else if(q.type==='truefalse'){
    answer=state.tempAnswer;
    let allCorrect=true;
    const rows=document.querySelectorAll('.tf-row');
    rows.forEach((row,i)=>{
      const btns=row.querySelectorAll('.tf-btn');
      btns.forEach(btn=>btn.style.pointerEvents='none');
      const isCorrect=answer[i]===q.statements[i].answer;
      if(!isCorrect)allCorrect=false;
      row.classList.add(isCorrect?'correct':'incorrect');
      // Highlight the correct button
      btns.forEach(btn=>{
        const btnVal=btn.textContent==='Vrai';
        if(btnVal===q.statements[i].answer)btn.classList.add('correct');
        else if(btn.classList.contains('selected')&&!isCorrect)btn.classList.add('incorrect');
      });
      // Show explanation if exists
      if(!isCorrect&&q.statements[i].explain){
        row.insertAdjacentHTML('beforeend',`<div style="width:100%;font-size:11px;color:var(--gold);margin-top:4px;padding-left:4px">→ ${q.statements[i].explain}</div>`);
      }
    });
    correct=allCorrect;
    delay=2500;
  }
  else if(q.type==='slider'){
    answer=state.tempAnswer;
    correct=null; // no correct answer
    if(q.hint){
      const card=document.querySelector('.question-card');
      card.insertAdjacentHTML('beforeend',`<div style="text-align:center;color:var(--dim);font-size:12px;margin-top:8px">${q.hint}</div>`);
      delay=1500;
    }
  }

  // Save answer
  state.answers[q.id]={answer,correct,ts:Date.now()};

  // Send to sheets
  if(q.phase!==0){
    sendToSheets({action:'save_answer',answer:{
      studentName:state.name,
      questionId:q.id,
      questionText:q.q,
      studentAnswer:answer,
      correctAnswer:q.a||q.answer||q.expected||'',
      questionType:q.type,
      isCorrect:correct,
      points:correct?1:0,
      maxPoints:(q.type==='slider'||q.type==='longtext')?0:1
    }});
  }

  // Disable validate button and show "Suivant" button
  document.getElementById('validateBtn').disabled=true;
  document.getElementById('validateBtn').style.display='none';

  // Show next button after feedback delay
  setTimeout(()=>{
    const navRow=document.querySelector('.nav-row');
    if(navRow){
      const nextBtn=document.createElement('button');
      nextBtn.className='btn-primary';
      nextBtn.textContent='Suivant →';
      nextBtn.onclick=()=>{
        state.idx++;
        state.tempAnswer=null;
        selectedMulti=[];
        render();
      };
      navRow.appendChild(nextBtn);
    }
  },delay);
}

// Student quiz mode
buildActiveQuestions();
render();

// Expose all functions to global scope for onclick handlers
window.toggleAllPhases = toggleAllPhases;
window.selectMCQ = selectMCQ;
window.toggleMulti = toggleMulti;
window.toggleWord = toggleWord;
window.selectTF = selectTF;
window.updateSlider = updateSlider;
window.checkMatchComplete = checkMatchComplete;
window.checkMatch3Complete = checkMatch3Complete;
window.checkGeoComplete = checkGeoComplete;
window.prevQ = prevQ;
window.validate = validate;
window.renderQuestion = renderQuestion;
window.render = render;

} // end startQuiz()
</script>
