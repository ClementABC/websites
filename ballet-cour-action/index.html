<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Du ballet de cour au ballet d'action</title>
<script>
  window.__QUIZ_CONFIG = {
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwb4ZdA_PvAzGBCdrTdetjjI8er3JLgZIIR7MPcTUiZOUhn14QoJ_LleGyX9-RQ1TNN/exec'
  };
</script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap");
:root{--bg:#0a0a12;--surface:#14141f;--surface-2:#1c1c2e;--text:#f0eee6;--dim:#8a86a0;--border:#ffffff14;--accent:#d4a853;--accent-glow:#d4a8534d;--purple:#9b6dff;--purple-glow:#9b6dff33;--success:#34d399;--success-glow:#34d39926;--error:#f87171;--error-glow:#f8717126;--radius:16px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-family:DM Sans,system-ui,sans-serif}
.quiz-app{display:flex;position:relative;overflow-x:hidden;flex-direction:column;min-height:100dvh}
.quiz-app:before{content:"";position:fixed;pointer-events:none;z-index:0;background:radial-gradient(at 20% 0%,#9b6dff14 0%,#0000 60%),radial-gradient(at 80% 100%,#d4a8530f 0%,#0000 60%);inset:0}
.quiz-content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px}
.progress-bar-wrap{position:sticky;z-index:10;background:linear-gradient(to bottom,var(--bg)60%,transparent);padding:12px 0;top:0}
.progress-track{background:var(--surface-2);overflow:hidden;border-radius:3px;height:6px}
.progress-fill{background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:3px;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-label{color:var(--dim);text-align:right;margin-top:6px;font-size:12px;font-weight:500}
.phase-badge{display:inline-flex;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);background:var(--purple-glow);border-radius:20px;align-items:center;gap:6px;margin-bottom:12px;padding:5px 12px;font-size:11px;font-weight:700}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);animation:slideUp .4s cubic-bezier(.2,0,0,1);padding:24px 20px}
@keyframes slideUp{0%{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.question-number{color:var(--dim);margin-bottom:8px;font-family:Playfair Display,serif;font-size:14px}
.question-text{color:var(--text);margin-bottom:24px;font-family:Playfair Display,serif;font-size:20px;font-weight:700;line-height:1.4}
.question-text em{color:var(--accent);font-style:italic}
.options-grid{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;text-align:left;background:var(--surface-2);border:2px solid var(--border);color:var(--text);cursor:pointer;border-radius:12px;align-items:center;gap:12px;width:100%;padding:14px 16px;transition:all .2s;font-family:DM Sans,sans-serif;font-size:15px;font-weight:500;line-height:1.4}
.option-btn:active{transform:scale(.98)}
.option-btn.selected{border-color:var(--purple);background:var(--purple-glow)}
.option-btn.correct{border-color:var(--success)!important;background:var(--success-glow)!important}
.option-btn.incorrect{opacity:.7;border-color:var(--error)!important;background:var(--error-glow)!important}
.option-btn.correct-reveal{border-color:var(--success)!important;background:var(--success-glow)!important}
.option-letter{display:flex;background:#ffffff0f;border-radius:8px;flex-shrink:0;justify-content:center;align-items:center;width:28px;height:28px;font-size:13px;font-weight:700}
.actions-row{display:flex;gap:10px;margin-top:20px}
.btn-primary{cursor:pointer;background:linear-gradient(135deg,var(--purple),#7c4dff);color:#fff;border:none;border-radius:12px;flex:1;padding:14px 20px;transition:all .2s;font-family:DM Sans,sans-serif;font-size:15px;font-weight:700}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-validate{background:linear-gradient(135deg,var(--accent),#c0933a);color:#0a0a12}
.welcome,.results{display:flex;text-align:center;flex-direction:column;flex:1;justify-content:center;align-items:center;gap:20px;padding:40px 20px}
.welcome-title{background:linear-gradient(135deg,var(--text),var(--accent));-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;font-family:Playfair Display,serif;font-size:32px;font-weight:700;line-height:1.2}
.welcome-sub{color:var(--dim);max-width:400px;font-size:16px;line-height:1.6}
.results-score{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;font-family:Playfair Display,serif;font-size:72px;font-weight:700}
.explanation{animation:fadeIn .3s ease;background:linear-gradient(135deg,#d4a85314,#9b6dff0f);border:1px solid #d4a85333;border-radius:12px;margin-top:20px;padding:16px}
@keyframes fadeIn{0%{opacity:0}to{opacity:1}}
.explanation-title{text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:8px;font-size:12px;font-weight:700}
.explanation-text{color:var(--text);opacity:.9;font-size:14px;line-height:1.6}
@media (min-width:640px){.quiz-content{padding:24px}.question-text{font-size:24px}.welcome-title{font-size:40px}}
</style>
</head>
<body>
<div class="quiz-app">
  <div class="quiz-content" id="app"></div>
</div>
<script>
const QUIZ = {
  title: "Du ballet de cour au ballet d'action",
  subtitle: "XVIIᵉ–XVIIIᵉ siècle",
  questions: [
    {id:"Q0",type:"text",q:"Avant de commencer, quel est ton prénom ?",ph:"Ton prénom"},
    {id:"Q1",type:"words",q:"Quels sont les 2 ou 3 mots les plus importants ?",sub:"« L'esthétique du ballet évolue entre héritage de la danse baroque et nouvelles exigences d'expressivité. »",max:3,a:["esthétique","ballet","héritage","danse","baroque","exigences","expressivité"]},
    {id:"Q2",type:"rank",q:"Classez ces styles du plus ancien au plus récent",items:["Carole médiévale","Ballet de cour","Comédie-ballet","Tragédie lyrique","Belle danse","Opéra-ballet français","Ballet d'action","Ballet romantique"],answer:["Carole médiévale","Ballet de cour","Comédie-ballet","Tragédie lyrique","Belle danse","Opéra-ballet français","Ballet d'action","Ballet romantique"]},
    {id:"Q3",type:"mcq",q:"Quelle période correspond au « ballet de cour » en France ?",opts:["1350 – 1450","1581 – vers 1670","1700 – 1760","1789 – 1830"],a:1},
    {id:"Q4",type:"mcq",q:"Quel est le premier véritable ballet d'action ?",opts:["Les Indes galantes (Rameau, 1735)","Les Saisons (Hilverding, 1743)","L'Amour et Psyché (Hilverding, 1752)","Les Horaces (Noverre, 1774)"],a:2},
    {id:"Q11",type:"match",q:"Associez chaque style à sa définition",pairs:[["Ballet de cour","Spectacle aristocratique mêlant danse, musique et poésie"],["Comédie-ballet","Forme créée par Molière et Lully"],["Tragédie lyrique","Opéra français à la française avec ballet intégré"],["Ballet d'action","Ballet pantomime dramatique sans chant"]]},
    {id:"Q12",type:"mcq",q:"Qu'est-ce que la notation Feuillet ?",opts:["Un système de notation musicale","Un système de notation chorégraphique du XVIIIe siècle","Une technique de danse baroque","Un type de costume"],a:1},
    {id:"QN1",type:"mcq",q:"Qui a théorisé le ballet d'action dans ses 'Lettres sur la danse' ?",opts:["Jean-Georges Noverre","Pierre Beauchamp","Louis XIV","Marie Sallé"],a:0},
    {id:"QN6",type:"multi",q:"Quelles sont les caractéristiques du ballet d'action ? (plusieurs réponses)",opts:["Narration par la danse seule","Usage du chant","Pantomime expressive","Décors et costumes réalistes","Suivre la musique sans histoire"],a:[0,2,3]},
    {id:"QN10",type:"match",q:"Associez les œuvres à leurs chorégraphes",pairs:[["Jason et Médée","Noverre"],["Pygmalion","Hilverding"],["La Fille mal gardée","Dauberval"]]},
    {id:"Q27",type:"match",q:"Reliez les concepts aux définitions",pairs:[["Belle danse","Style noble et gracieux de la danse baroque"],["Pantomime","Art de s'exprimer par gestes"],["Opéra-ballet","Spectacle mêlant chant, danse et mise en scène"]]}
  ]
};

let state = {idx:0,answers:{},name:"",startTime:Date.now(),sessionId:'s_'+Math.random().toString(36).slice(2)};

function saveSession(){localStorage.setItem('ballet_session',JSON.stringify({id:state.sessionId,name:state.name,start:state.startTime,answers:state.answers}));}
function sendToSheets(payload){const url=window.__QUIZ_CONFIG.APPS_SCRIPT_URL;if(!url)return;console.log('Sending to sheets:',payload);fetch(url+'?payload='+encodeURIComponent(JSON.stringify(payload)),{method:'GET'}).then(r=>r.text()).then(t=>console.log('Sheets response:',t)).catch(e=>console.error('Sheets error:',e));}

function render(){
  const app=document.getElementById('app');
  const q=QUIZ.questions[state.idx];
  const progress=Math.round((state.idx/QUIZ.questions.length)*100);
  
  if(state.idx===0 && !state.name){
    app.innerHTML=`<div class="welcome">
      <div class="welcome-title">${QUIZ.title}</div>
      <div class="welcome-sub">${QUIZ.subtitle}<br><br>11 questions • ~8 min</div>
      <div style="width:100%;max-width:320px">
        <input id="nameInput" type="text" placeholder="Ton prénom" style="width:100%;padding:14px 16px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;margin-bottom:12px" autofocus>
        <button class="btn-primary" onclick="startQuiz()">Commencer →</button>
      </div>
    </div>`;
    document.getElementById('nameInput').focus();
    document.getElementById('nameInput').onkeypress=e=>{if(e.key==='Enter')startQuiz()};
    return;
  }
  
  if(state.idx>=QUIZ.questions.length){
    const correct=Object.values(state.answers).filter(a=>a.correct).length;
    const total=QUIZ.questions.length-1;
    const pct=Math.round(correct/total*100);
    const timeMin=Math.round((Date.now()-state.startTime)/60000);
    
    // Save to sheets
    sendToSheets({action:'save_session',session:{studentName:state.name,score:correct,totalQuestions:total,timestamp:Date.now(),timeTaken:`${timeMin} min`}});
    
    app.innerHTML=`<div class="results">
      <div class="results-score">${correct}/${total}</div>
      <div style="color:var(--dim);font-size:18px">${pct}% • ${timeMin} min</div>
      <div style="font-size:20px;font-weight:600;margin-top:8px">${pct>=70?'Excellent ! 🎉':pct>=50?'Bien joué ! 👍':'À revoir 📚'}</div>
      <button class="btn-primary" style="margin-top:24px;max-width:200px" onclick="location.reload()">Recommencer</button>
    </div>`;
    return;
  }

  let html=`<div class="progress-bar-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-label">${state.idx} / ${QUIZ.questions.length-1}</div>
  </div>
  <div class="question-card">
    <div class="question-number">Question ${state.idx}</div>
    <div class="question-text">${q.q}</div>`;
  
  if(q.sub) html+=`<div style="color:var(--dim);font-size:14px;margin:-12px 0 16px;font-style:italic">${q.sub}</div>`;
  
  if(q.type==='text'){
    html+=`<input id="answer" type="text" placeholder="${q.ph||''}" style="width:100%;padding:14px;background:var(--surface-2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:15px" autofocus>`;
  } else if(q.type==='mcq'){
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" data-idx="${i}" onclick="selectMCQ(${i})">
        <span class="option-letter">${String.fromCharCode(65+i)}</span>
        <span>${opt}</span>
      </button>`;
    });
    html+='</div>';
  } else if(q.type==='words'){
    html+=`<div id="words"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="wordInput" type="text" placeholder="Un mot important..." style="flex:1;padding:12px;background:var(--surface-2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px">
        <button class="btn-primary" style="padding:12px 16px;flex:0" onclick="addWord()">+</button>
      </div>`;
  } else if(q.type==='rank'){
    // Shuffle items randomly each time
    const shuffled=[...q.items].sort(()=>Math.random()-0.5);
    html+='<div class="options-grid" id="rankList">';
    shuffled.forEach((item,i)=>{
      html+=`<div class="option-btn" style="cursor:grab" draggable="true" data-idx="${i}">
        <span class="option-letter">${i+1}</span>
        <span style="flex:1">${item}</span>
        <span style="color:var(--dim)">⋮⋮</span>
      </div>`;
    });
    html+='</div><div style="color:var(--dim);font-size:12px;margin-top:8px">Glissez-déposez pour réordonner</div>';
  } else if(q.type==='match'){
    html+='<div style="display:flex;flex-direction:column;gap:10px">';
    q.pairs.forEach((p,i)=>{
      html+=`<div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;padding:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600">${p[0]}</div>
        <div style="color:var(--dim)">→</div>
        <select data-idx="${i}" onchange="checkMatchComplete()" style="flex:1;padding:10px;background:var(--surface-2);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:13px">
          <option value="">Choisir...</option>
          ${q.pairs.map(x=>`<option>${x[1]}</option>`).sort().map(o=>`<option>${o.replace('<option>','').replace('</option>','')}</option>`).join('')}
        </select>
      </div>`;
    });
    html+='</div>';
  } else if(q.type==='multi'){
    html+='<div class="options-grid">';
    q.opts.forEach((opt,i)=>{
      html+=`<button class="option-btn" data-idx="${i}" onclick="toggleMulti(${i})">
        <span class="option-letter">□</span>
        <span>${opt}</span>
      </button>`;
    });
    html+='</div>';
  }
  
  html+=`<div class="actions-row">
    ${state.idx>1?'<button class="btn-primary" style="background:var(--surface-2);color:var(--text)" onclick="prevQ()">← Retour</button>':''}
    <button class="btn-primary btn-validate" id="validateBtn" onclick="validate()" disabled>Valider →</button>
  </div></div>`;
  
  app.innerHTML=html;
  if(q.type==='text') document.getElementById('answer').focus();
  setupInteractions(q);
}

function startQuiz(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){alert('Entre ton prénom');return}
  state.name=name;
  state.idx=1;
  saveSession();
  render();
}

function selectMCQ(i){
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelector(`[data-idx="${i}"]`).classList.add('selected');
  document.getElementById('validateBtn').disabled=false;
  state.tempAnswer=i;
}

let selectedMulti=[];
function toggleMulti(i){
  const btn=document.querySelector(`[data-idx="${i}"]`);
  const idx=selectedMulti.indexOf(i);
  if(idx>-1){selectedMulti.splice(idx,1);btn.classList.remove('selected');btn.querySelector('.option-letter').textContent='□';}
  else{selectedMulti.push(i);btn.classList.add('selected');btn.querySelector('.option-letter').textContent='✓';}
  document.getElementById('validateBtn').disabled=selectedMulti.length===0;
  state.tempAnswer=[...selectedMulti];
}


function checkMatchComplete(){
  const selects=document.querySelectorAll('select[data-idx]');
  const allFilled=Array.from(selects).every(s=>s.value!=='');
  document.getElementById('validateBtn').disabled=!allFilled;
  console.log('Match check:', Array.from(selects).map(s=>s.value), 'All filled:', allFilled);
}

function addWord(){
  const input=document.getElementById('wordInput');
  const word=input.value.trim();
  if(!word)return;
  const container=document.getElementById('words');
  const span=document.createElement('span');
  span.textContent=word;
  span.style.cssText='display:inline-block;background:var(--purple-glow);color:var(--purple);padding:6px 12px;border-radius:20px;margin:0 6px 6px 0;font-size:13px;font-weight:600';
  span.onclick=()=>span.remove();
  container.appendChild(span);
  input.value='';
  state.tempAnswer=Array.from(container.children).map(s=>s.textContent);
  document.getElementById('validateBtn').disabled=state.tempAnswer.length===0;
}

function setupInteractions(q){
  if(q.type==='rank'){
    const list=document.getElementById('rankList');
    let dragged=null;
    list.querySelectorAll('[draggable]').forEach(item=>{
      item.ondragstart=e=>{dragged=item;item.style.opacity='0.5'};
      item.ondragend=()=>{item.style.opacity='1';updateRankOrder()};
      item.ondragover=e=>e.preventDefault();
      item.ondrop=e=>{e.preventDefault();if(dragged&&dragged!==item){const items=[...list.children];const dIdx=items.indexOf(dragged);const tIdx=items.indexOf(item);if(dIdx<tIdx)item.after(dragged);else item.before(dragged);updateRankOrder()}};
    });
    function updateRankOrder(){
      [...list.children].forEach((item,i)=>{item.querySelector('.option-letter').textContent=i+1});
      state.tempAnswer=[...list.children].map(item=>item.querySelector('span:last-child').previousElementSibling.textContent);
      document.getElementById('validateBtn').disabled=false;
    }
    updateRankOrder();
  }
}

function validate(){
  const q=QUIZ.questions[state.idx];
  let answer,correct=false;
  
  if(q.type==='text'){answer=document.getElementById('answer').value;correct=answer.length>0;}
  else if(q.type==='mcq'){answer=state.tempAnswer;correct=answer===q.a;}
  else if(q.type==='words'){
    answer=state.tempAnswer||[];
    correct=answer.length>0;
    // Show expected answers
    const container=document.getElementById('words');
    if(container && q.a){
      const expectedDiv=document.createElement('div');
      expectedDiv.style.cssText='margin-top:16px;padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)';
      expectedDiv.innerHTML='<div style="color:var(--dim);font-size:12px;margin-bottom:8px">Mots attendus :</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+q.a.map(w=>`<span style="padding:4px 10px;background:var(--purple-glow);color:var(--purple);border-radius:12px;font-size:12px;font-weight:600">${w}</span>`).join('')+'</div>';
      container.parentNode.appendChild(expectedDiv);
      
      // Highlight user words that match
      Array.from(container.children).forEach(span=>{
        const word=span.textContent.toLowerCase();
        if(q.a.some(expected=>expected.toLowerCase()===word || expected.toLowerCase().includes(word) || word.includes(expected.toLowerCase()))){
          span.style.background='var(--green-glow)';
          span.style.color='var(--green)';
          span.style.border='2px solid var(--green)';
        }
      });
    }
  }
  else if(q.type==='rank'){answer=state.tempAnswer;correct=JSON.stringify(answer)===JSON.stringify(q.answer);}
  else if(q.type==='match'){
    const selects=document.querySelectorAll('select');
    answer=Array.from(selects).map(s=>s.value);
    correct=answer.every((v,i)=>v===q.pairs[i][1]);
  }
  else if(q.type==='multi'){answer=state.tempAnswer;correct=JSON.stringify(answer.sort())===JSON.stringify(q.a.sort());}
  
  state.answers[q.id]={answer,correct,ts:Date.now()};
  saveSession();
  
  // Show visual feedback for match questions
  if(q.type==='match'){
    document.querySelectorAll('select').forEach((sel,i)=>{
      sel.disabled=true;
      if(sel.value===q.pairs[i][1]){
        sel.style.borderColor='var(--success)';
        sel.style.background='var(--success-glow)';
      } else if(sel.value!==''){
        sel.style.borderColor='var(--error)';
        sel.style.background='var(--error-glow)';
      }
    });
  }
  
  // Send to sheets
  sendToSheets({
    action:'save_answer',
    answer:{
      studentName:state.name,
      questionId:q.id,
      questionText:q.q,
      studentAnswer:answer,
      correctAnswer:q.a || q.answer || '',
      questionType:q.type,
      isCorrect:correct,
      points:correct?1:0,
      maxPoints:1
    }
  });
  
  // Show feedback
  if(q.type==='mcq'){
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.disabled=true;
      if(i===q.a)btn.classList.add('correct');
      else if(i===state.tempAnswer&&!correct)btn.classList.add('incorrect');
    });
  } else if(q.type==='rank'){
    const items=document.querySelectorAll('#rankList .option-btn');
    items.forEach((item,i)=>{
      item.style.cursor='default';
      item.draggable=false;
      const itemText=item.querySelector('span:nth-child(2)').textContent;
      const correctIdx=q.answer.indexOf(itemText);
      if(correctIdx===i){
        item.classList.add('correct');
      } else {
        item.classList.add('incorrect');
      }
    });
  } else if(q.type==='multi'){
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
      btn.style.pointerEvents='none';
      if(q.a.includes(i)){
        btn.classList.add('correct');
      } else if(state.tempAnswer.includes(i)){
        btn.classList.add('incorrect');
      }
    });
  }
  
  setTimeout(()=>{state.idx++;state.tempAnswer=null;selectedMulti=[];render();}, ['mcq','rank','multi','words','match'].includes(q.type)?1500:300);
}

function prevQ(){if(state.idx>1){state.idx--;render();}}

render();
</script>
</body>
</html>
