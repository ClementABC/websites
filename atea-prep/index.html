<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>ATEA 2026 — Prépa Concours Danse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;
  --accent2:#8b5cf6;--green:#22c55e;--red:#ef4444;
  --orange:#f59e0b;--border:#475569;
  --radius:16px;--card-radius:20px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}

/* Header */
.header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.header .countdown{font-size:13px;color:var(--orange);font-weight:600}
.header .countdown span{font-size:20px}

/* Navigation */
.nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:8px 16px;border-radius:30px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.nav-btn:active{transform:scale(0.96)}

/* Main content area */
.main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* Card styles */
.card{background:var(--surface);border-radius:var(--card-radius);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:8px}
.card-q{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:16px}
.card-a{font-size:15px;line-height:1.6;color:var(--muted);display:none;padding-top:16px;border-top:1px solid var(--border)}
.card-a.visible{display:block;animation:fadeIn .3s ease}
.card-category{position:absolute;top:0;right:0;padding:6px 14px;border-radius:0 var(--card-radius) 0 12px;font-size:11px;font-weight:600;background:var(--accent2);color:#fff}

/* Flip button */
.flip-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.flip-btn:active{transform:scale(0.98);opacity:0.9}
.flip-btn.revealed{background:var(--surface2)}

/* Progress ring */
.progress-container{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.progress-ring{width:48px;height:48px;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:4}
.progress-ring .bg{stroke:var(--surface2)}
.progress-ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.progress-text{font-size:12px;font-weight:700;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.progress-label{font-size:14px;color:var(--muted)}
.progress-label strong{color:var(--text)}

/* Quiz mode */
.quiz-option{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;text-align:left;cursor:pointer;transition:all .2s;line-height:1.4}
.quiz-option:active{transform:scale(0.98)}
.quiz-option.correct{border-color:var(--green);background:rgba(34,197,94,0.15);color:var(--green)}
.quiz-option.wrong{border-color:var(--red);background:rgba(239,68,68,0.15);color:var(--red)}
.quiz-option.disabled{pointer-events:none;opacity:0.6}

/* Score bar */
.score-bar{display:flex;gap:12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);margin-bottom:16px;justify-content:center}
.score-item{text-align:center}
.score-item .num{font-size:24px;font-weight:700}
.score-item .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.score-item.good .num{color:var(--green)}
.score-item.bad .num{color:var(--red)}

/* Acronym grid */
.acr-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.acr-card:active{transform:scale(0.98)}
.acr-card .acr{font-size:20px;font-weight:700;color:var(--accent)}
.acr-card .def{font-size:14px;color:var(--muted);margin-top:6px;display:none;line-height:1.4}
.acr-card.open .def{display:block;animation:fadeIn .2s ease}

/* Timeline */
.tl-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(71,85,105,0.3)}
.tl-date{min-width:100px;font-size:13px;font-weight:700;color:var(--orange);line-height:1.5}
.tl-event{font-size:14px;line-height:1.5;color:var(--text)}

/* Stats dashboard */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .big{font-size:28px;font-weight:800}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px}

/* Search */
.search{display:flex;margin-bottom:16px}
.search input{flex:1;padding:12px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}

/* Confidence buttons */
.confidence{display:flex;gap:8px;margin-top:16px}
.conf-btn{flex:1;padding:12px;border-radius:var(--radius);border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.conf-btn:active{transform:scale(0.96)}
.conf-btn.easy{background:rgba(34,197,94,0.15);color:var(--green)}
.conf-btn.medium{background:rgba(245,158,11,0.15);color:var(--orange)}
.conf-btn.hard{background:rgba(239,68,68,0.15);color:var(--red)}

/* Home stats */
.home-hero{text-align:center;padding:32px 16px}
.home-hero .emoji{font-size:48px;margin-bottom:12px}
.home-hero h2{font-size:22px;font-weight:700;margin-bottom:4px}
.home-hero .sub{color:var(--muted);font-size:14px}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.home-action{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;border:none;color:var(--text);width:100%;text-align:left;font-size:15px}
.home-action:active{transform:scale(0.98)}
.home-action .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.home-action .icon.blue{background:rgba(59,130,246,0.15)}
.home-action .icon.purple{background:rgba(139,92,246,0.15)}
.home-action .icon.orange{background:rgba(245,158,11,0.15)}
.home-action .icon.green{background:rgba(34,197,94,0.15)}
.home-action .icon.red{background:rgba(239,68,68,0.15)}
.home-action .meta{flex:1}
.home-action .meta .title{font-weight:600}
.home-action .meta .desc{font-size:13px;color:var(--muted);margin-top:2px}
.home-action .arrow{color:var(--muted);font-size:18px}

/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .emoji{font-size:48px;margin-bottom:12px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* Swipe hint */
.swipe-hint{text-align:center;font-size:12px;color:var(--muted);padding:8px;margin-top:8px}

/* Bottom bar */
.bottom-bar{display:flex;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}
.bottom-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;transition:color .2s}
.bottom-btn.active{color:var(--accent)}
.bottom-btn .ico{font-size:22px}

/* Filter pills */
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Result banner */
.result-banner{padding:24px;border-radius:var(--card-radius);text-align:center;margin-bottom:16px}
.result-banner.pass{background:rgba(34,197,94,0.1);border:2px solid var(--green)}
.result-banner.fail{background:rgba(239,68,68,0.1);border:2px solid var(--red)}
.result-banner .big-emoji{font-size:48px;margin-bottom:8px}
.result-banner .result-text{font-size:20px;font-weight:700}
.result-banner .result-sub{font-size:14px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <h1>🩰 ATEA 2026</h1>
  <div class="countdown" id="countdown"></div>
</div>

<div class="nav" id="nav"></div>

<div class="main" id="main"></div>

<div class="bottom-bar">
  <button class="bottom-btn active" onclick="showTab('home')"><span class="ico">🏠</span>Accueil</button>
  <button class="bottom-btn" onclick="showTab('study')"><span class="ico">📖</span>Réviser</button>
  <button class="bottom-btn" onclick="showTab('quiz')"><span class="ico">🎯</span>Quiz</button>
  <button class="bottom-btn" onclick="showTab('stats')"><span class="ico">📊</span>Stats</button>
</div>

<script src="content.js"></script>
<script>
// ===== STATE =====
const STATE_KEY = 'atea-prep-state';
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if (s && s.version === 2) return s;
  } catch(e) {}
  return {
    version: 2,
    seen: {},        // questionId -> {count, lastSeen, confidence}
    quizHistory: [], // [{date, score, total, wrong:[]}]
    acrSeen: {},     // acronym -> count
    streak: 0,
    lastStudy: null,
    totalStudied: 0
  };
}

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

// ===== COUNTDOWN =====
function updateCountdown() {
  const exam = new Date('2026-06-22T09:00:00+02:00');
  const now = new Date();
  const diff = exam - now;
  if (diff <= 0) {
    document.getElementById('countdown').innerHTML = '🎯 <span>Jour J</span>';
    return;
  }
  const days = Math.ceil(diff / (1000*60*60*24));
  document.getElementById('countdown').innerHTML = `J-<span>${days}</span>`;
}
updateCountdown();
setInterval(updateCountdown, 60000);

// ===== TABS =====
let currentTab = 'home';
let currentSubTab = null;

function showTab(tab) {
  currentTab = tab;
  currentSubTab = null;
  document.querySelectorAll('.bottom-btn').forEach((b, i) => {
    b.classList.toggle('active', ['home','study','quiz','stats'][i] === tab);
  });
  
  switch(tab) {
    case 'home': renderHome(); break;
    case 'study': renderStudyNav(); break;
    case 'quiz': renderQuizSetup(); break;
    case 'stats': renderStats(); break;
  }
}

// ===== HOME =====
function renderHome() {
  const totalQ = CONTENT.questions.length;
  const studied = Object.keys(state.seen).length;
  const pct = Math.round(studied / totalQ * 100);
  const quizzes = state.quizHistory.length;
  const avgScore = quizzes > 0 ? Math.round(state.quizHistory.reduce((a,h) => a + h.score/h.total*100, 0) / quizzes) : 0;
  
  document.getElementById('nav').innerHTML = '';
  document.getElementById('main').innerHTML = `
    <div class="home-hero fade-in">
      <div class="emoji">🩰</div>
      <h2>Concours ATEA Danse</h2>
      <div class="sub">${CONTENT.exam.places} places · ${CONTENT.exam.candidates} candidats</div>
    </div>
    
    <div class="stat-grid fade-in">
      <div class="stat-card">
        <div class="big" style="color:var(--accent)">${studied}/${totalQ}</div>
        <div class="label">Questions vues</div>
      </div>
      <div class="stat-card">
        <div class="big" style="color:${avgScore >= 60 ? 'var(--green)' : 'var(--orange)'}">${quizzes > 0 ? avgScore+'%' : '—'}</div>
        <div class="label">Score moyen</div>
      </div>
    </div>
    
    <div class="home-actions fade-in">
      <button class="home-action" onclick="startQuickStudy()">
        <div class="icon blue">📖</div>
        <div class="meta">
          <div class="title">Révision rapide</div>
          <div class="desc">10 flashcards aléatoires</div>
        </div>
        <div class="arrow">›</div>
      </button>
      <button class="home-action" onclick="startQuiz(10)">
        <div class="icon purple">🎯</div>
        <div class="meta">
          <div class="title">Quiz — Simulation jury</div>
          <div class="desc">10 questions, besoin de 6/10</div>
        </div>
        <div class="arrow">›</div>
      </button>
      <button class="home-action" onclick="showTab('study'); showSubTab('weak')">
        <div class="icon red">🔥</div>
        <div class="meta">
          <div class="title">Points faibles</div>
          <div class="desc">${getWeakCount()} questions à retravailler</div>
        </div>
        <div class="arrow">›</div>
      </button>
      <button class="home-action" onclick="showTab('study'); showSubTab('acronyms')">
        <div class="icon orange">🔤</div>
        <div class="meta">
          <div class="title">Acronymes</div>
          <div class="desc">${CONTENT.acronyms.length} sigles à maîtriser</div>
        </div>
        <div class="arrow">›</div>
      </button>
      <button class="home-action" onclick="showTab('study'); showSubTab('timeline')">
        <div class="icon green">📅</div>
        <div class="meta">
          <div class="title">Frise chronologique</div>
          <div class="desc">${CONTENT.timeline.length} dates clés</div>
        </div>
        <div class="arrow">›</div>
      </button>
    </div>
  `;
}

function getWeakCount() {
  return CONTENT.questions.filter(q => {
    const s = state.seen[q.id];
    return s && s.confidence === 'hard';
  }).length;
}

// ===== STUDY NAV =====
function renderStudyNav() {
  const categories = [...new Set(CONTENT.questions.map(q => q.category))];
  document.getElementById('nav').innerHTML = `
    <button class="nav-btn active" onclick="showSubTab('all')">Toutes</button>
    ${categories.map(c => `<button class="nav-btn" onclick="showSubTab('cat:${c}')">${c.split(' ').slice(0,2).join(' ')}</button>`).join('')}
    <button class="nav-btn" onclick="showSubTab('weak')">🔥 Faibles</button>
    <button class="nav-btn" onclick="showSubTab('acronyms')">🔤 Sigles</button>
    <button class="nav-btn" onclick="showSubTab('timeline')">📅 Frise</button>
    <button class="nav-btn" onclick="showSubTab('numbers')">🔢 Chiffres</button>
  `;
  showSubTab(currentSubTab || 'all');
}

function showSubTab(sub) {
  currentSubTab = sub;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  // Highlight the right nav button
  const navBtns = document.querySelectorAll('.nav-btn');
  navBtns.forEach(b => {
    const onclick = b.getAttribute('onclick') || '';
    if (onclick.includes(`'${sub}'`)) b.classList.add('active');
  });
  
  if (sub === 'acronyms') return renderAcronyms();
  if (sub === 'timeline') return renderTimeline();
  if (sub === 'numbers') return renderNumbers();
  
  let questions = CONTENT.questions;
  if (sub === 'weak') {
    questions = questions.filter(q => state.seen[q.id]?.confidence === 'hard');
    if (questions.length === 0) {
      document.getElementById('main').innerHTML = `
        <div class="empty fade-in"><div class="emoji">🎉</div>
        <p>Aucune question marquée comme difficile !</p>
        <p style="margin-top:8px">Étudie des flashcards et marque les questions difficiles pour les retrouver ici.</p></div>`;
      return;
    }
  } else if (sub.startsWith('cat:')) {
    const cat = sub.substring(4);
    questions = questions.filter(q => q.category === cat);
  }
  
  renderFlashcards(questions);
}

// ===== FLASHCARDS =====
let flashcardIndex = 0;
let flashcardDeck = [];
let flashcardRevealed = false;

function renderFlashcards(questions) {
  flashcardDeck = [...questions];
  flashcardIndex = 0;
  flashcardRevealed = false;
  showFlashcard();
}

function startQuickStudy() {
  const shuffled = [...CONTENT.questions].sort(() => Math.random() - 0.5).slice(0, 10);
  currentTab = 'study';
  document.querySelectorAll('.bottom-btn').forEach((b, i) => b.classList.toggle('active', i === 1));
  document.getElementById('nav').innerHTML = `<button class="nav-btn active">Révision rapide — 10 cartes</button>`;
  renderFlashcards(shuffled);
}

function showFlashcard() {
  if (flashcardIndex >= flashcardDeck.length) {
    document.getElementById('main').innerHTML = `
      <div class="empty fade-in"><div class="emoji">✅</div>
      <p style="font-size:18px;font-weight:600">Session terminée !</p>
      <p style="margin-top:8px;color:var(--muted)">${flashcardDeck.length} cartes révisées</p>
      <button class="flip-btn" style="margin-top:20px;max-width:200px;margin-left:auto;margin-right:auto" onclick="showTab(currentTab)">Continuer</button>
      </div>`;
    return;
  }
  
  const q = flashcardDeck[flashcardIndex];
  const total = flashcardDeck.length;
  const pct = Math.round(flashcardIndex / total * 100);
  const seen = state.seen[q.id];
  const confLabel = seen ? {easy:'✅ Maîtrisé', medium:'🟡 En cours', hard:'🔴 Difficile'}[seen.confidence] || '' : '';
  flashcardRevealed = false;
  
  document.getElementById('main').innerHTML = `
    <div class="progress-container fade-in">
      ${progressRing(pct, 44)}
      <div class="progress-label"><strong>${flashcardIndex + 1}</strong> / ${total}${confLabel ? ' · ' + confLabel : ''}</div>
    </div>
    <div class="card fade-in">
      <div class="card-category">${q.category.split('&')[0].trim()}</div>
      <div class="card-label">Question ${q.id}</div>
      <div class="card-q">${q.question}</div>
      <div class="card-a" id="answer">${formatAnswer(q.answer)}</div>
    </div>
    <button class="flip-btn" id="flipBtn" onclick="revealAnswer()">Voir la réponse</button>
    <div class="confidence" id="confBtns" style="display:none">
      <button class="conf-btn easy" onclick="rateCard('easy')">✅ Facile</button>
      <button class="conf-btn medium" onclick="rateCard('medium')">🟡 Moyen</button>
      <button class="conf-btn hard" onclick="rateCard('hard')">🔴 Difficile</button>
    </div>
    <div class="swipe-hint">Évalue ta confiance pour passer à la suivante</div>
  `;
}

function formatAnswer(text) {
  // Basic formatting — highlight key terms
  return text
    .replace(/(\d{1,2}\s+\w+\s+\d{4})/g, '<strong style="color:var(--orange)">$1</strong>')
    .replace(/(article?\s+L?\.\s*[\d\-]+)/gi, '<strong>$1</strong>');
}

function revealAnswer() {
  if (flashcardRevealed) return;
  flashcardRevealed = true;
  document.getElementById('answer').classList.add('visible');
  document.getElementById('flipBtn').textContent = 'Réponse affichée';
  document.getElementById('flipBtn').classList.add('revealed');
  document.getElementById('confBtns').style.display = 'flex';
  
  // Mark as seen
  const q = flashcardDeck[flashcardIndex];
  if (!state.seen[q.id]) {
    state.seen[q.id] = {count: 0, confidence: null};
  }
  state.seen[q.id].count++;
  state.seen[q.id].lastSeen = new Date().toISOString();
  state.totalStudied++;
  state.lastStudy = new Date().toISOString();
  saveState();
}

function rateCard(confidence) {
  const q = flashcardDeck[flashcardIndex];
  state.seen[q.id].confidence = confidence;
  saveState();
  flashcardIndex++;
  showFlashcard();
}

// ===== QUIZ =====
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizWrong = [];

function renderQuizSetup() {
  document.getElementById('nav').innerHTML = '';
  const categories = [...new Set(CONTENT.questions.map(q => q.category))];
  document.getElementById('main').innerHTML = `
    <div class="fade-in" style="padding:16px 0">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">🎯 Mode Quiz</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:24px">Simulation d'oral — réponds comme devant le jury</p>
      
      <div class="card">
        <div class="card-label">Format du concours</div>
        <p style="font-size:15px;line-height:1.6;color:var(--muted)">
          Le jury pose <strong style="color:var(--text)">10 questions</strong> à l'oral.<br>
          Il faut <strong style="color:var(--green)">au moins 6 bonnes réponses</strong> pour réussir.
        </p>
      </div>
      
      <p style="font-size:14px;font-weight:600;margin:16px 0 8px">Catégorie</p>
      <div class="filter-row" id="quizFilters">
        <button class="filter-pill active" onclick="setQuizFilter(this, 'all')">Toutes</button>
        ${categories.map(c => `<button class="filter-pill" onclick="setQuizFilter(this, '${c}')">${c.split('&')[0].trim()}</button>`).join('')}
      </div>
      
      <button class="flip-btn" style="margin-top:24px" onclick="startQuiz(10)">Lancer le quiz — 10 questions</button>
      <button class="flip-btn" style="margin-top:10px;background:var(--surface2)" onclick="startQuiz(50)">Marathon — 50 questions</button>
    </div>
  `;
}

let quizFilter = 'all';
function setQuizFilter(btn, filter) {
  quizFilter = filter;
  document.querySelectorAll('#quizFilters .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function startQuiz(count) {
  let pool = [...CONTENT.questions];
  if (quizFilter !== 'all') {
    pool = pool.filter(q => q.category === quizFilter);
  }
  quizQuestions = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
  quizIndex = 0;
  quizScore = 0;
  quizWrong = [];
  
  currentTab = 'quiz';
  document.querySelectorAll('.bottom-btn').forEach((b, i) => b.classList.toggle('active', i === 2));
  document.getElementById('nav').innerHTML = '';
  showQuizQuestion();
}

function showQuizQuestion() {
  if (quizIndex >= quizQuestions.length) {
    showQuizResults();
    return;
  }
  
  const q = quizQuestions[quizIndex];
  const pct = Math.round(quizIndex / quizQuestions.length * 100);
  
  document.getElementById('main').innerHTML = `
    <div class="score-bar fade-in">
      <div class="score-item good"><div class="num">${quizScore}</div><div class="label">Correct</div></div>
      <div class="score-item"><div class="num">${quizIndex + 1}/${quizQuestions.length}</div><div class="label">Question</div></div>
      <div class="score-item bad"><div class="num">${quizIndex - quizScore}</div><div class="label">Raté</div></div>
    </div>
    
    <div class="card fade-in">
      <div class="card-category">${q.category.split('&')[0].trim()}</div>
      <div class="card-label">Question ${q.id}</div>
      <div class="card-q">${q.question}</div>
    </div>
    
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;text-align:center">Formule ta réponse à voix haute, puis vérifie 👇</p>
    
    <button class="flip-btn" id="quizRevealBtn" onclick="revealQuizAnswer()">Voir la réponse modèle</button>
    
    <div id="quizAnswer" style="display:none">
      <div class="card fade-in" style="margin-top:16px;border-left:3px solid var(--accent)">
        <div class="card-label">Réponse modèle</div>
        <p style="font-size:15px;line-height:1.6;color:var(--muted)">${formatAnswer(q.answer)}</p>
      </div>
      <p style="font-size:14px;font-weight:600;text-align:center;margin:16px 0 8px">Ta réponse était…</p>
      <div class="confidence">
        <button class="conf-btn easy" onclick="quizRate(true)">✅ Bonne</button>
        <button class="conf-btn hard" onclick="quizRate(false)">❌ Insuffisante</button>
      </div>
    </div>
  `;
}

function revealQuizAnswer() {
  document.getElementById('quizRevealBtn').style.display = 'none';
  document.getElementById('quizAnswer').style.display = 'block';
}

function quizRate(correct) {
  const q = quizQuestions[quizIndex];
  if (correct) {
    quizScore++;
    if (!state.seen[q.id]) state.seen[q.id] = {count:0};
    state.seen[q.id].confidence = state.seen[q.id].confidence === 'hard' ? 'medium' : 'easy';
  } else {
    quizWrong.push(q);
    if (!state.seen[q.id]) state.seen[q.id] = {count:0};
    state.seen[q.id].confidence = 'hard';
  }
  state.seen[q.id].count = (state.seen[q.id].count || 0) + 1;
  state.seen[q.id].lastSeen = new Date().toISOString();
  saveState();
  quizIndex++;
  showQuizQuestion();
}

function showQuizResults() {
  const total = quizQuestions.length;
  const pct = Math.round(quizScore / total * 100);
  const passed = total === 10 ? quizScore >= 6 : pct >= 60;
  
  state.quizHistory.push({
    date: new Date().toISOString(),
    score: quizScore,
    total: total,
    wrong: quizWrong.map(q => q.id)
  });
  saveState();
  
  document.getElementById('main').innerHTML = `
    <div class="result-banner ${passed ? 'pass' : 'fail'} fade-in">
      <div class="big-emoji">${passed ? '🎉' : '💪'}</div>
      <div class="result-text">${quizScore} / ${total}</div>
      <div class="result-sub">${passed ? 'Admissible ! Continue comme ça.' : total === 10 ? 'Il faut 6/10 — on retravaille !' : 'Continue de réviser !'}</div>
    </div>
    
    ${quizWrong.length > 0 ? `
      <p style="font-size:16px;font-weight:600;margin-bottom:12px">🔴 Questions à retravailler</p>
      ${quizWrong.map(q => `
        <div class="card" style="margin-bottom:10px;cursor:pointer" onclick="this.querySelector('.card-a').classList.toggle('visible')">
          <div class="card-label">Q${q.id}</div>
          <div style="font-size:15px;font-weight:600">${q.question}</div>
          <div class="card-a" style="font-size:14px">${formatAnswer(q.answer)}</div>
        </div>
      `).join('')}
    ` : ''}
    
    <button class="flip-btn" style="margin-top:16px" onclick="startQuiz(10)">Nouveau quiz</button>
    <button class="flip-btn" style="margin-top:10px;background:var(--surface2)" onclick="showTab('home')">Retour</button>
  `;
}

// ===== ACRONYMS =====
function renderAcronyms() {
  let filtered = CONTENT.acronyms;
  document.getElementById('main').innerHTML = `
    <div class="search fade-in"><input type="text" placeholder="Chercher un sigle…" oninput="filterAcronyms(this.value)"></div>
    <div id="acrList">${renderAcrList(filtered)}</div>
  `;
}

function renderAcrList(list) {
  return list.map(a => `
    <div class="acr-card" onclick="this.classList.toggle('open')">
      <div class="acr">${a.acronym}</div>
      <div class="def">${a.definition}</div>
    </div>
  `).join('');
}

function filterAcronyms(query) {
  const q = query.toLowerCase();
  const filtered = CONTENT.acronyms.filter(a => 
    a.acronym.toLowerCase().includes(q) || a.definition.toLowerCase().includes(q)
  );
  document.getElementById('acrList').innerHTML = renderAcrList(filtered);
}

// ===== TIMELINE =====
function renderTimeline() {
  document.getElementById('main').innerHTML = `
    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px" class="fade-in">📅 Frise chronologique</h2>
    <div class="fade-in">
      ${CONTENT.timeline.map(t => `
        <div class="tl-item">
          <div class="tl-date">${t.date}</div>
          <div class="tl-event">${t.event}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ===== NUMBERS / CHIFFRES =====
function renderNumbers() {
  document.getElementById('main').innerHTML = `
    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px" class="fade-in">🔢 Chiffres-clés</h2>
    <div class="fade-in">
      ${CONTENT.flashcards.map(f => `
        <div class="acr-card" onclick="this.classList.toggle('open')">
          <div class="acr" style="font-size:15px">${f.front}</div>
          <div class="def">${f.back}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ===== STATS =====
function renderStats() {
  document.getElementById('nav').innerHTML = '';
  const totalQ = CONTENT.questions.length;
  const studied = Object.keys(state.seen).length;
  const easy = CONTENT.questions.filter(q => state.seen[q.id]?.confidence === 'easy').length;
  const medium = CONTENT.questions.filter(q => state.seen[q.id]?.confidence === 'medium').length;
  const hard = CONTENT.questions.filter(q => state.seen[q.id]?.confidence === 'hard').length;
  const unseen = totalQ - studied;
  const quizzes = state.quizHistory;
  
  document.getElementById('main').innerHTML = `
    <h2 style="font-size:20px;font-weight:700;margin-bottom:16px" class="fade-in">📊 Progression</h2>
    
    <div class="stat-grid fade-in">
      <div class="stat-card">
        <div class="big" style="color:var(--accent)">${studied}</div>
        <div class="label">Questions vues / ${totalQ}</div>
      </div>
      <div class="stat-card">
        <div class="big" style="color:var(--green)">${easy}</div>
        <div class="label">Maîtrisées</div>
      </div>
      <div class="stat-card">
        <div class="big" style="color:var(--orange)">${medium}</div>
        <div class="label">En cours</div>
      </div>
      <div class="stat-card">
        <div class="big" style="color:var(--red)">${hard}</div>
        <div class="label">Difficiles</div>
      </div>
    </div>
    
    <div class="card fade-in">
      <div class="card-label">Couverture par catégorie</div>
      ${[...new Set(CONTENT.questions.map(q => q.category))].map(cat => {
        const catQs = CONTENT.questions.filter(q => q.category === cat);
        const catSeen = catQs.filter(q => state.seen[q.id]).length;
        const pct = Math.round(catSeen / catQs.length * 100);
        return `
          <div style="margin-top:12px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
              <span>${cat}</span><span style="color:var(--muted)">${catSeen}/${catQs.length}</span>
            </div>
            <div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;transition:width .5s"></div>
            </div>
          </div>`;
      }).join('')}
    </div>
    
    ${quizzes.length > 0 ? `
      <div class="card fade-in">
        <div class="card-label">Historique des quiz</div>
        ${quizzes.slice(-5).reverse().map(h => {
          const d = new Date(h.date);
          const dateStr = d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
          const pct = Math.round(h.score / h.total * 100);
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(71,85,105,0.3)">
              <span style="font-size:13px;color:var(--muted)">${dateStr}</span>
              <span style="font-size:15px;font-weight:600;color:${pct >= 60 ? 'var(--green)' : 'var(--red)'}">${h.score}/${h.total}</span>
            </div>`;
        }).join('')}
      </div>
    ` : ''}
    
    <button class="flip-btn" style="background:var(--red);margin-top:16px" onclick="if(confirm('Réinitialiser toute la progression ?')){localStorage.removeItem('${STATE_KEY}');state=loadState();showTab('home')}">Réinitialiser</button>
  `;
}

// ===== PROGRESS RING =====
function progressRing(pct, size=48) {
  const r = (size - 8) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return `<div class="progress-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
      <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" 
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="progress-text">${pct}%</div>
  </div>`;
}

// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ===== INIT =====
showTab('home');
</script>
</body>
</html>
